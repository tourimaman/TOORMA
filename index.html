function makePad(x,z){
  const g = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.12,2.2), padMat);
  plate.position.y = 0.06;
  g.add(plate);
  [-0.35,0.4].forEach(zc=>{
    [-1,1].forEach(sd=>{
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.85,0.05,0.16), chevMat);
      bar.position.set(sd*0.3, 0.15, zc);
      bar.rotation.y = -sd*Math.PI/4;
      g.add(bar);
    });
  });
  g.position.set(x,0,z);
  scene.add(g);
  pickups.push({obj:g, type:'pad', used:false});
}
function spawnPickupPattern(ws){
  const z0 = -78;
  const laneMax = LANE_WIDTH/2 - 1.1;
  const x0 = (Math.random()*2-1)*laneMax;
  const roll = Math.random();
  if(roll < 0.5){
    const n = 8;
    for(let i=0;i<n;i++) makeCoin(x0,0.9,z0-i*1.7);
    return n*1.7;
  }
  if(roll < 0.72){
    const n = 10;
    for(let i=0;i<n;i++) makeCoin(Math.sin(i*0.75)*laneMax*0.8,0.9,z0-i*1.6);
    return n*1.6;
  }
  if(roll < 0.92 || starT > 0 || pickups.some(p=>p.type==='star')){
    // Jump pad with a coin arc that follows the exact flight path
    makePad(x0, z0);
    const T = 2*PAD_JUMP_SPEED/(-GRAVITY);
    const n = 9;
    for(let k=1;k<=n;k++){
      const t = T*k/(n+1);
      const y = 0.8 + PAD_JUMP_SPEED*t + 0.5*GRAVITY*t*t;
      makeCoin(x0, y, z0 - ws*t);
    }
    return ws*T + 2;
  }
  for(let i=0;i<4;i++) makeCoin(x0,0.9,z0 + (i+1)*1.7);
  makeStar(x0, z0);
  return 8;
}
function updatePickups(dt, ws){
  pickupTimer -= dt;
  if(pickupTimer <= 0){
    const len = spawnPickupPattern(ws);
    pickupTimer = (len + 10 + Math.random()*16)/Math.max(ws,1);
  }
  const coinVal = 1 + Math.floor(combo/10);
  const nowMs = performance.now();
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i], o = p.obj;
    o.position.z += ws*dt;
    if(p.type === 'coin') o.rotation.y += dt*6;
    if(p.type === 'star'){ o.rotation.y += dt*3; o.position.y = 1.15 + Math.sin(nowMs/250)*0.15; }
    if(starT > 0 && p.type === 'coin' && o.position.z > player.position.z - 16){
      const k = Math.min(1, dt*7);
      o.position.x += (player.position.x - o.position.x)*k;
      o.position.y += (player.position.y + 0.8 - o.position.y)*k;
    }
    const zNow = o.position.z, zPrev = zNow - ws*dt;
    let remove = false;
    if(zNow > player.position.z - 0.9 && zPrev < player.position.z + 0.9){
      const dx = Math.abs(o.position.x - player.position.x);
      const dy = Math.abs(o.position.y - (player.position.y + 0.8));
      if(p.type === 'coin' && dx < 1.0 && dy < 1.3){
        addCoins(coinVal); bumpCombo(1); sfx.coin(combo);
        burst(o.position.clone(), [0xffd23a,0xfff3a0], 6, 3, 3);
        remove = true;
      } else if(p.type === 'star' && dx < 1.3 && dy < 1.6){
        burst(o.position.clone(), RAINBOW, 24, 6, 5);
        startStar();
        remove = true;
      } else if(p.type === 'pad' && !p.used && dx < 1.15 && jumpY < 0.6){
        p.used = true;
        isJumping = true; jumpVelY = PAD_JUMP_SPEED;
        springWaveT = SPRING_FLIGHT_DURATION;
        springWaveElapsed = 0;
        springStartYaw = player.rotation.y;
        const faceDelta = Math.atan2(Math.sin(Math.PI-springStartYaw), Math.cos(Math.PI-springStartYaw));
        springFaceYaw = springStartYaw + faceDelta;
        attackPhase = 'none'; attackT = 0; punchDip = 0;
        burst(o.position.clone(), [0x19d3ff,0xfff200,0xffffff], 18, 5, 6);
        sfx.pad(); shake(0.2,0.25); fovKick = Math.max(fovKick, 8);
        popText(player.position.clone().add(new THREE.Vector3(0,2.2,0)), 'ジャンプ台！', 'blue');
        if(policeSpawned) startPoliceEscape(null, 'spring'); // the spring launches you clear of the police
      }
    }
    if(remove || o.position.z > 8){ scene.remove(o); pickups.splice(i,1); }
  }
}

    leftThigh = 0.2 + 1.25*step; rightThigh = -0.12 - 1.05*step;
    leftKnee = -0.22 - Math.max(0, -step)*2.05;
    rightKnee = -0.22 - Math.max(0, step)*1.55;
  } else if(gait.id === 'quick'){
    leftThigh = step*0.62; rightThigh = -step*0.62;
    leftKnee = -Math.max(0, -step)*1.18; rightKnee = -Math.max(0, step)*1.18;
  }
  legL.upper.rotation.x += (leftThigh - legL.upper.rotation.x)*k;
  legR.upper.rotation.x += (rightThigh - legR.upper.rotation.x)*k;
  legL.knee.rotation.x += (leftKnee - legL.knee.rotation.x)*k;
  legR.knee.rotation.x += (rightKnee - legR.knee.rotation.x)*k;

  const step = Math.sin(phase), armBeat = Math.sin(phase*2), k = Math.min(1, dt*18);

  let rightArmX = gait.armBase - armBeat*gait.armSwing;
  let leftArmZ = -gait.armSpread, rightArmZ = gait.armSpread;
  let leftElbow = gait.elbow, rightElbow = gait.elbow;
  if(gait.id === 'ninja'){
    leftArmX = -1.1 + armBeat*0.15; rightArmX = -1.1 - armBeat*0.15;
    leftArmZ = -0.45; rightArmZ = 0.45; leftElbow = 0.03; rightElbow = 0.03;
  } else if(gait.id === 'power'){
    leftArmX = -0.1 + armBeat*1.55; rightArmX = -0.1 - armBeat*1.55;
    leftArmZ = -0.28; rightArmZ = 0.28;
    leftElbow = 0.85 + Math.max(0, armBeat)*0.75;
    rightElbow = 0.85 + Math.max(0, -armBeat)*0.75;
  } else if(gait.id === 'skip'){
    leftArmX = -0.25 + step*0.68; rightArmX = -0.25 - step*0.68;
    leftArmZ = -1.45 - step*0.98; rightArmZ = 1.45 - step*0.98;
    leftElbow = 0.55 + Math.max(0, armBeat)*0.45;
    rightElbow = 0.55 + Math.max(0, -armBeat)*0.45;
  } else if(gait.id === 'quick'){
    leftArmX = -0.95 + armBeat*1.12; rightArmX = -0.95 - armBeat*1.12;
    leftArmZ = -0.24; rightArmZ = 0.24; leftElbow = 1.42; rightElbow = 1.42;
  }
  armL.shoulder.rotation.x += (leftArmX - armL.shoulder.rotation.x)*k;
  armR.shoulder.rotation.x += (rightArmX - armR.shoulder.rotation.x)*k;
  armL.shoulder.rotation.z += (leftArmZ - armL.shoulder.rotation.z)*k;
  armR.shoulder.rotation.z += (rightArmZ - armR.shoulder.rotation.z)*k;
  armL.elbow.rotation.x += (leftElbow - armL.elbow.rotation.x)*k;
  armR.elbow.rotation.x += (rightElbow - armR.elbow.rotation.x)*k;
  armL.shoulder.rotation.y += (0 - armL.shoulder.rotation.y)*k;
  armR.shoulder.rotation.y += (0 - armR.shoulder.rotation.y)*k;
}

// ---------- Arrest cutscene: police swarm, tackle and pin the player ----------
function lerpTo(o, k, v, kk){ o[k] += (v - o[k]) * kk; }
function updateCaught(dt){
  caughtT += dt;
  const t = caughtT;
  const n = polices.length;
  const kk = Math.min(1, dt*9);
  const pp = player.position;

  // Player: freezes for a beat, gets tackled at ~0.45 s, then lies face-down struggling.
  const down = t > 0.45;
  if(down && !caughtImpact){
    caughtImpact = true;
    burst(new THREE.Vector3(pp.x, 0.6, pp.z), [0xffffff,0xffd24a,0x3b7bff], 24, 6, 5);
    shake(0.5, 0.4); sfx.hit(); flashScreen('#ffffff', 0.3); hitStop = 0.08;
  }
  lerpTo(player.rotation, 'x', down ? -1.5 : -0.35, kk);
  lerpTo(player.rotation, 'y', 0, kk);
  lerpTo(player.rotation, 'z', 0, kk);
  const struggle = down ? Math.sin(t*22)*0.35 : 0;
  lerpTo(player.position, 'y', down ? 0.3 : 0, kk);
  lerpTo(legL.upper.rotation, 'x', down ? 0.25 + struggle : 0.2, kk);
  lerpTo(legR.upper.rotation, 'x', down ? 0.25 - struggle : 0.2, kk);
  lerpTo(legL.knee.rotation, 'x', down ? -0.6 : -0.3, kk);
  lerpTo(legR.knee.rotation, 'x', down ? -0.6 : -0.3, kk);
  lerpTo(armL.shoulder.rotation, 'x', down ? -0.4 + struggle : -0.8, kk);
  lerpTo(armR.shoulder.rotation, 'x', down ? -0.4 - struggle : -0.8, kk);
  lerpTo(armL.shoulder.rotation, 'z', down ? -1.5 : -0.6, kk);
  lerpTo(armR.shoulder.rotation, 'z', down ? 1.5 : 0.6, kk);
  lerpTo(armL.elbow.rotation, 'x', 0.3, kk);
  lerpTo(armR.elbow.rotation, 'x', 0.3, kk);
  lerpTo(torso.rotation, 'y', 0, kk);
  lerpTo(hips.rotation, 'y', 0, kk);

  // Police: sprint in, ring the player, then dive on top and pin them down.
  polices.forEach((pl,i)=>{
    const g = pl.group;
    const ring = i < 6 ? 0 : 1;
    const c = ring ? Math.max(1, n-6) : Math.min(6, n);
    const idx = ring ? i-6 : i;
    const a = (idx/c)*Math.PI*2 + (ring ? 0.5 : 0);
    const r = ring ? 1.75 : (down ? 0.75 : 1.05);
    const tx = pp.x + Math.sin(a)*r, tz = pp.z + Math.cos(a)*r;
    const mk = Math.min(1, dt*(down ? 8 : 6));
    g.position.x += (tx - g.position.x)*mk;
    g.position.z += (tz - g.position.z)*mk;
    // face the player
    const dx = pp.x - g.position.x, dz = pp.z - g.position.z;
    let yaw = Math.atan2(-dx, -dz), dy = yaw - g.rotation.y;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    g.rotation.y += dy*Math.min(1, dt*12);
    pl.air = false; pl.jy = 0;
    const dist = Math.hypot(dx, dz);
    if(!down){
      // sprint
      pl.walkCycle += dt*9;
      const sw = Math.sin(pl.walkCycle)*0.8;
      lerpTo(g.position, 'y', Math.abs(Math.sin(pl.walkCycle))*0.08, kk);
      lerpTo(g.rotation, 'x', -0.3, kk);
      pl.legL.upper.rotation.x = sw; pl.legR.upper.rotation.x = -sw;
      pl.legL.knee.rotation.x = -Math.max(0, sw)*1.0; pl.legR.knee.rotation.x = -Math.max(0, -sw)*1.0;
      lerpTo(pl.armL.shoulder.rotation, 'x', -1.4, kk); lerpTo(pl.armR.shoulder.rotation, 'x', -1.4, kk);
      lerpTo(pl.armL.shoulder.rotation, 'z', -0.2, kk); lerpTo(pl.armR.shoulder.rotation, 'z', 0.2, kk);
      lerpTo(pl.armL.elbow.rotation, 'x', 0.2, kk); lerpTo(pl.armR.elbow.rotation, 'x', 0.2, kk);
    } else {
      // dogpile: crouch low, lean over, arms pushing down on the suspect
      pl.walkCycle += dt*14;
      const jiggle = Math.sin(pl.walkCycle + i*1.7)*0.08;
      lerpTo(g.rotation, 'x', -0.95 + jiggle, kk);
      lerpTo(g.position, 'y', -0.05 + Math.abs(jiggle)*0.3, kk);
      lerpTo(pl.legL.upper.rotation, 'x', 0.7, kk); lerpTo(pl.legR.upper.rotation, 'x', 0.7, kk);
      lerpTo(pl.legL.knee.rotation, 'x', -1.5, kk); lerpTo(pl.legR.knee.rotation, 'x', -1.5, kk);
      lerpTo(pl.armL.shoulder.rotation, 'x', -1.9 + jiggle*2, kk); lerpTo(pl.armR.shoulder.rotation, 'x', -1.9 - jiggle*2, kk);
      lerpTo(pl.armL.shoulder.rotation, 'z', -0.1, kk); lerpTo(pl.armR.shoulder.rotation, 'z', 0.1, kk);
      lerpTo(pl.armL.elbow.rotation, 'x', 0.1, kk); lerpTo(pl.armR.elbow.rotation, 'x', 0.1, kk);
    }
  });

  if(t > 1.5 && !caughtText){
    caughtText = true;
    popText(new THREE.Vector3(pp.x, 1.6, pp.z), '🚔 確保！', 'big blue');
    tone(520, 0.12, 'square', 0.05); tone(420, 0.18, 'square', 0.05, 0, 0.14);
  }
  if(t > 2.6){
    caught = false;
    sfx.die(); flashScreen('#ff3b30', 0.35);
    gameoverEl.style.display = 'flex';
  }
}

let last = performance.now();

// Watches frame time once a second: if it can't hold ~50 fps it lowers the render
// resolution step by step (then turns shadows off as a last resort); if there is
// plenty of headroom it raises the resolution again.
let fpsFrames = 0, fpsStart = 0, slowSecs = 0, fastSecs = 0;
function adaptQuality(now){
  if(!Q.light || homeActive){ fpsStart = 0; fpsFrames = 0; slowSecs = fastSecs = 0; return; }
  if(!fpsStart){ fpsStart = now; return; }
  fpsFrames++;
  if(now - fpsStart < 1000) return;
  const fps = fpsFrames*1000/(now - fpsStart);
  fpsFrames = 0; fpsStart = now;
  if(fps < 50){ slowSecs++; fastSecs = 0; } else if(fps > 57){ fastSecs++; slowSecs = 0; } else { slowSecs = fastSecs = 0; }
  if(slowSecs >= 2){
    slowSecs = 0;
    if(curPR > PR_MIN + 0.01){
      curPR = Math.max(PR_MIN, curPR - 0.15);
      renderer.setPixelRatio(curPR); renderer.setSize(innerWidth, innerHeight);
    } else if(!shadowsOff){
      shadowsOff = true; sun.castShadow = false; // one-time hitch, then much cheaper
    }
  } else if(fastSecs >= 6 && curPR < PR_MAX - 0.01 && !shadowsOff){
    fastSecs = 0;
    curPR = Math.min(PR_MAX, curPR + 0.1);
    renderer.setPixelRatio(curPR); renderer.setSize(innerWidth, innerHeight);
  }
}
// Home screen: the runner stands centre-frame facing the camera, frozen mid-run.
const HOME_CYCLE = 1.1; // fixed phase of the run cycle = a nice mid-stride pose
function poseRun(ch, c){

  ch.armR.shoulder.rotation.set(-1.15 - flutter, 0, 0.45);

function poseHomeOfficer(pl){

function homeScene(dt=0){

    armL.shoulder.rotation.set(-1.15 + flutter, 0, -0.45);
    armR.shoulder.rotation.set(-1.15 - flutter, 0, 0.45);
    armL.elbow.rotation.x = 0.55; armR.elbow.rotation.x = 0.55;
  }
  if(camera.fov !== 60){ camera.fov = 60; camera.updateProjectionMatrix(); }
  camera.position.set(0, skinMode ? 1.25 : 0.05, skinMode ? 3.35 : (phoneLayout ? 4.25 : 4.1));
  camera.lookAt(0, skinMode ? 0.95 : 0.65, 0);
}
function animate(now){
  requestAnimationFrame(animate);
  adaptQuality(now);
  let dt = Math.min((now-last)/1000, 0.05);
  last = now;
  if(homeActive){ homeScene(dt); renderer.render(scene, camera); return; }
  if(hitStop > 0){ hitStop -= dt; dt *= 0.12; } // brief slow-mo on big hits
  const worldSpeed = running ? speed * (starT > 0 ? 1.5 : 1) : 0;

  if(running){
    distance += worldSpeed*dt;
    const dm = Math.floor(distance);
    if(dm !== lastScoreShown){ lastScoreShown = dm; scoreEl.textContent = dm + ' m'; }
    if(distance >= nextSpeedUpAt){
      speed += 1;
      nextSpeedUpAt += SPEEDUP_EVERY;
      showSpeedUp();
    }
    if(starT > 0){
      starT -= dt;
      starfillEl.style.width = Math.max(0, starT/STAR_DURATION*100) + '%';
      aura.material.color.setHSL((now/700)%1, 1, 0.6);
      aura.scale.setScalar(1 + Math.sin(now/90)*0.06);
      aura.visible = starT > 1.5 || Math.floor(now/120)%2 === 0;
      burst(player.position.clone().add(new THREE.Vector3(0,0.9,0.4)), RAINBOW, 1, 1.2, 0.5);
      if(starT <= 0) endStar();
    }
    updateCombo(dt);
    updatePickups(dt, worldSpeed);
    if(springWaveT > 0){
      springWaveElapsed += dt;
      springWaveT = Math.max(0, springWaveT-dt);
      if(!isJumping || springWaveT === 0){
        springWaveT = 0;
        player.rotation.y = springStartYaw;
      }
    }

    const inputX = joyActive ? joyDX : keyDX;
    playerX += inputX * dt * 6;
    playerX = Math.max(-halfLane, Math.min(halfLane, playerX));
    player.position.x += (playerX - player.position.x) * Math.min(1, dt*10);
    // turn to face movement direction instead of leaning sideways
    const gait = RUN_STYLE_BY_ID[runStyleId] || RUN_STYLE_BY_ID.normal;
    const yawTarget = -inputX*0.55;
    if(killCelebrationT > 0){
      const progress = Math.max(0, Math.min(1, 1 - killCelebrationT/KILL_CELEBRATION_DURATION));
      const spinEase = progress*progress*(3 - 2*progress);
      player.rotation.y = killCelebrationYaw + Math.PI*4*spinEase;
    } else if(springWaveT > 0){
      const progress = Math.max(0, Math.min(1, springWaveElapsed/SPRING_FLIGHT_DURATION));
      if(progress < 0.12){
        const t = progress/0.12, turn = t*t*(3 - 2*t);
        player.rotation.y = springStartYaw + (springFaceYaw-springStartYaw)*turn;
      } else if(progress > 0.9){
        const t = (progress-0.9)/0.1, turn = t*t*(3 - 2*t);
        player.rotation.y = springFaceYaw + (springStartYaw-springFaceYaw)*turn;
      } else {
        player.rotation.y = springFaceYaw;
      }
    } else {
      player.rotation.y += (yawTarget - player.rotation.y) * Math.min(1, dt*8);
    }
    player.rotation.z = 0;
    // forward lean increases with running speed (Naruto-run style, more extreme)
    const leanTarget = -(0.5 + Math.min(1, speed/maxSpeed)*0.25)*gait.lean;
    player.rotation.x += (leanTarget - player.rotation.x) * Math.min(1, dt*6);

    // Jump physics
    if(isJumping){
      jumpVelY += GRAVITY*dt;
      jumpY += jumpVelY*dt;
      if(jumpY <= 0){ jumpY = 0; isJumping = false; jumpVelY = 0; }
    }

    // Recycle ground segments
    groundSegs.forEach(g=>{
      g.position.z += worldSpeed*dt;
      if(g.position.z > SEG_LEN){
        g.position.z -= SEG_LEN*SEG_COUNT;
      }
      g.visible = !Q.light || g.position.z > -72; // fully fogged anyway
    });

    // Move & recycle obstacle rows (each row moves and resets as one rigid
    // unit, so a formation never drifts apart over a long run)
    obstacles.forEach(row=>{
      row.position.z += worldSpeed*dt;
      if(row.position.z > 8){
        row.position.z -= 100 + Math.random()*20;
        repositionObstacleRow(row);
      }
      const {items, hitRadius, full} = row.userData;
      // collision check against every item in the row (skip if jumped high enough)
      const clearedByJump = jumpY > (row.userData.clearY || 0.85);
      if(starT > 0){
        // Star dash: bulldoze straight through everything
        for(const item of items.slice()){
          const dz = Math.abs(row.position.z - player.position.z);
          const dx = full ? 0 : Math.abs(row.position.x + item.position.x - player.position.x);
          if(dz < 1.5 && (full || dx < 1.3)){
            burst(new THREE.Vector3(row.position.x + item.position.x, 0.5, row.position.z), [0xff6a00,0xffffff,0xffcc00], 10, 6, 5);
            row.remove(item);
            addCoins(1); bumpCombo(1); sfx.coin(combo); shake(0.1,0.12);
          }
        }
      } else if(!clearedByJump){
        for(const item of items){
          const dz = Math.abs(row.position.z - player.position.z);
          const dx = full ? 0 : Math.abs(row.position.x + item.position.x - player.position.x);
          if(item.parent === row && dz < 0.5 && (full || dx < (hitRadius + 0.3))){
            hitObstacle(row, item);
            break;
          }
        }
      }
    });

    // Spawn and approach cars from the front, same as people — jumping
    // never clears them, the player must actually step out of the way.
    carSpawnTimer -= dt;
    if(carSpawnTimer <= 0){
      spawnCar(-60 - Math.random()*10);
      carSpawnTimer = 7 + Math.random()*6;
    }
    for(let i=cars.length-1;i>=0;i--){
      const car = cars[i];
      car.position.z += (worldSpeed + CAR_APPROACH_SPEED)*dt;
      const dz = Math.abs(car.position.z - player.position.z);
      const dx = Math.abs(car.position.x - player.position.x);
      if(starT > 0){
        if(dz < 2.2 && dx < car.userData.hitRadius + 0.6){
          smashCar(car);
          scene.remove(car); disposeGeos(car);
          cars.splice(i,1);
          continue;
        }
      } else if(dz < 1.0 && dx < car.userData.hitRadius){
        endGame();
      }
      if(!car.userData.passed && car.position.z >= player.position.z){
        car.userData.passed = true;
        if(starT <= 0 && dx < car.userData.hitRadius + 1.1) nearMiss(car);
      }
      if(car.position.z > 8){
        scene.remove(car); disposeGeos(car);
        cars.splice(i,1);
      }
    }

    updatePolice(dt, worldSpeed);

    // Occasionally send a red enemy walking in from the front
    enemySpawnTimer -= dt;
    if(enemySpawnTimer <= 0){
      // Sometimes a small group arrives together, spread out in depth.
      const n = Math.random() < 0.4 ? 2 + Math.floor(Math.random()*2) : 1;
      for(let k=0;k<n;k++) spawnEnemy(player.position.z - 55 - Math.random()*15 - k*6);
      enemySpawnTimer = 2.5 + Math.random()*3;
    }
    for(let i=enemies.length-1;i>=0;i--){
      const en = enemies[i];
      if(en.state === 'walk'){
        // Closes in faster than the scenery scroll alone — it's walking at you.
        const cfg = en.cfg;
        en.group.position.z += (worldSpeed + ENEMY_WALK_SPEED*cfg.speedMul)*dt;
        en.walkCycle += dt*cfg.rate;
        const s = Math.sin(en.walkCycle)*cfg.amp;
        en.legL.upper.rotation.x = s;
        en.legR.upper.rotation.x = -s;
        en.legL.knee.rotation.x = -Math.max(0, s)*0.7 - cfg.kneeBase;
        en.legR.knee.rotation.x = -Math.max(0, -s)*0.7 - cfg.kneeBase;
        // Plain human gait: opposite arm swings with the opposite leg.
        en.armL.shoulder.rotation.x = -s*0.6;
        en.armL.shoulder.rotation.z = 0;
        en.armL.elbow.rotation.x = 0.15 + Math.max(0,-s)*0.3;
        if(cfg.cane){
          // Right hand plants the cane in front of them instead of swinging.
          en.armR.shoulder.rotation.x = 0.35;
          en.armR.shoulder.rotation.z = 0;
          en.armR.elbow.rotation.x = 0.5;
        } else {
          en.armR.shoulder.rotation.x = s*0.6;
          en.armR.shoulder.rotation.z = 0;
          en.armR.elbow.rotation.x = 0.15 + Math.max(0,s)*0.3;
        }

        const dz = Math.abs(en.group.position.z - player.position.z);
        const dx = Math.abs(en.group.position.x - player.position.x);

        // The fist (with the knife in it) can land any time during the
        // attack — windup through recover — not just the single punch
        // frame, so a fast-closing enemy doesn't slip through the check.
        if((attackPhase !== 'none' && dz < PUNCH_RANGE_Z && dx < PUNCH_RANGE_X) ||
           (starT > 0 && dz < 2.2 && dx < 1.5)){
          onEnemyKilled(en);
        }
        // Just touching the enemy is no longer lethal.

        if(en.group.position.z > 8){
          scene.remove(en.group); disposeGeos(en.group);
          enemies.splice(i,1);
        }
      } else if(en.state === 'falling'){
        en.fallT += dt;
        const t = Math.min(1, en.fallT/FALL_DUR);
        const k = Math.min(1, dt*9);
        // Both hands clutch the stabbed spot (gut/chest), pulled to center.
        en.armL.shoulder.rotation.x += (0.95 - en.armL.shoulder.rotation.x)*k;
        en.armL.shoulder.rotation.z += (-0.55 - en.armL.shoulder.rotation.z)*k;
        en.armL.shoulder.rotation.y += (0.5 - en.armL.shoulder.rotation.y)*k;
        en.armL.elbow.rotation.x += (1.9 - en.armL.elbow.rotation.x)*k;
        en.armR.shoulder.rotation.x += (0.95 - en.armR.shoulder.rotation.x)*k;
        en.armR.shoulder.rotation.z += (0.55 - en.armR.shoulder.rotation.z)*k;
        en.armR.shoulder.rotation.y += (-0.5 - en.armR.shoulder.rotation.y)*k;
        en.armR.elbow.rotation.x += (1.9 - en.armR.elbow.rotation.x)*k;
        // Knees give out under it, then the whole body pitches down.
        const kneeTarget = t < 0.55 ? -1.7 : -0.3;
        const thighTarget = t < 0.55 ? 0.35 : 0.1;
        en.legL.upper.rotation.x += (thighTarget - en.legL.upper.rotation.x)*k;
        en.legR.upper.rotation.x += (thighTarget - en.legR.upper.rotation.x)*k;
        en.legL.knee.rotation.x += (kneeTarget - en.legL.knee.rotation.x)*k;
        en.legR.knee.rotation.x += (kneeTarget - en.legR.knee.rotation.x)*k;
        const pitchTarget = t < 0.55 ? -0.35 : -1.5;
        const dropTarget = t < 0.55 ? -0.15 : -0.95;
        en.group.rotation.x += (pitchTarget - en.group.rotation.x)*k;
        en.group.position.y += (dropTarget - en.group.position.y)*k;
        if(en.fallT >= FALL_DUR){ en.state = 'down'; en.fallT = 0; }
      } else if(en.state === 'down'){
        en.fallT += dt;
        if(en.fallT > 1.1){
          scene.remove(en.group); disposeGeos(en.group);
          enemies.splice(i,1);
        }
      }
    }

    // Legs: always keep running/jumping normally, regardless of attack state,
    // so the character can slash without breaking stride.
    if(isJumping){
      const target = { thigh: -1.0, knee: -1.9 };
      const k = Math.min(1, dt*14);
      legL.upper.rotation.x += (target.thigh - legL.upper.rotation.x)*k;
      legR.upper.rotation.x += (target.thigh - legR.upper.rotation.x)*k;
      legL.knee.rotation.x += (target.knee - legL.knee.rotation.x)*k;
      legR.knee.rotation.x += (target.knee - legR.knee.rotation.x)*k;
    } else {
      runCycle += dt * worldSpeed * 0.9 * gait.cycle;
      applyRunStyleLegPose(gait, runCycle, dt);
    }

    // The brief kill celebration owns the pose before normal attack/run poses resume.
    if(killCelebrationT > 0){
      const progress = Math.max(0, Math.min(1, 1 - killCelebrationT/KILL_CELEBRATION_DURATION));
      const beat = Math.sin(progress*Math.PI*2);
      const k = Math.min(1, dt*15);
      smoothArm(armL, CELEBRATION_ARM_L, k);
      smoothArm(armR, CELEBRATION_ARM_R, k);
      hips.rotation.y += (beat*0.22 - hips.rotation.y)*k;
      torso.rotation.y += (-beat*0.28 - torso.rotation.y)*k;
      player.rotation.x += (0.08 - player.rotation.x)*k;
      legL.upper.rotation.x += ((-0.38 + beat*0.18) - legL.upper.rotation.x)*k;
      legR.upper.rotation.x += ((-0.18 - beat*0.18) - legR.upper.rotation.x)*k;
      legL.knee.rotation.x += (-0.72 - legL.knee.rotation.x)*k;
      legR.knee.rotation.x += (-0.72 - legR.knee.rotation.x)*k;
      punchDip += (0 - punchDip)*k;
      killCelebrationT = Math.max(0, killCelebrationT-dt);
      if(killCelebrationT === 0) player.rotation.y = killCelebrationYaw;
    // Arms + torso + hips + legs: attack takes priority over jump/run poses.
    // The power chain runs legs -> hips -> torso -> shoulder -> fist.
    } else if(springWaveT > 0 && isJumping){
      const wave = Math.sin(springWaveElapsed*15);
      const k = Math.min(1, dt*15);
      // Face the camera, tuck the legs, and wave one raised hand during the pad flight.
      smoothArm(armL, {sx:-0.35, sy:0, sz:-1.25, ex:-0.8}, k);
      smoothArm(armR, {sx:-0.25, sy:wave*0.18, sz:2.45 + wave*0.1, ex:-0.65 + wave*0.25}, k);
      armL.elbow.rotation.z += (0 - armL.elbow.rotation.z)*k;
      armR.elbow.rotation.z += (wave*0.62 - armR.elbow.rotation.z)*k;
      hips.rotation.y += (0 - hips.rotation.y)*k;
      torso.rotation.y += (-wave*0.12 - torso.rotation.y)*k;
      player.rotation.x += (0.02 - player.rotation.x)*k;
      legL.upper.rotation.x += (-0.55 - legL.upper.rotation.x)*k;
      legR.upper.rotation.x += (-0.3 - legR.upper.rotation.x)*k;
      legL.knee.rotation.x += (-1.15 - legL.knee.rotation.x)*k;
      legR.knee.rotation.x += (-1.15 - legR.knee.rotation.x)*k;
      punchDip += (0 - punchDip)*k;
    } else if(attackPhase !== 'none'){
      attackT += dt;
      if(attackPhase === 'windup'){
        // Coil: back leg loads deep, hips wind up first, torso follows,
        // fist pulls back past the ribs — a real backswing to punch from.
        const armK = Math.min(1, dt*12);
        smoothArm(armR, POSE.windupArmR, armK);
        smoothArm(armL, POSE.windupArmL, armK);
        const bodyK = Math.min(1, dt*11);
        hips.rotation.y += (HIPS_TWIST.windup - hips.rotation.y) * bodyK;
        torso.rotation.y += (TORSO_TWIST.windup - torso.rotation.y) * Math.min(1, dt*10);
        const d = LEG_DRIVE.windup, legK = Math.min(1, dt*11);
        legR.upper.rotation.x += (d.backUpper - legR.upper.rotation.x)*legK;
        legR.knee.rotation.x += (d.backKnee - legR.knee.rotation.x)*legK;
        legL.upper.rotation.x += (d.frontUpper - legL.upper.rotation.x)*legK;
        legL.knee.rotation.x += (d.frontKnee - legL.knee.rotation.x)*legK;
        punchDip += (d.dip - punchDip) * legK;
        if(attackT >= WINDUP_DUR){ attackPhase = 'punch'; attackT = 0; }
      } else if(attackPhase === 'punch'){
        // Snap: back leg drives straight and hips fire through first,
        // torso and shoulder chase it, fist arrives last and fastest —
        // quicker than the other phases, but still eased, not a hard snap.
        smoothArm(armR, POSE.punchArmR, Math.min(1, dt*16));
        smoothArm(armL, POSE.punchArmL, Math.min(1, dt*13));
        hips.rotation.y += (HIPS_TWIST.punch - hips.rotation.y) * Math.min(1, dt*17);
        torso.rotation.y += (TORSO_TWIST.punch - torso.rotation.y) * Math.min(1, dt*15);
        const d = LEG_DRIVE.punch, legK = Math.min(1, dt*15);
        legR.upper.rotation.x += (d.backUpper - legR.upper.rotation.x)*legK;
        legR.knee.rotation.x += (d.backKnee - legR.knee.rotation.x)*legK;
        legL.upper.rotation.x += (d.frontUpper - legL.upper.rotation.x)*legK;
        legL.knee.rotation.x += (d.frontKnee - legL.knee.rotation.x)*legK;
        punchDip += (d.dip - punchDip) * legK;
        if(attackT >= PUNCH_DUR){ attackPhase = 'recover'; attackT = 0; }
      } else if(attackPhase === 'recover'){
        // Follow-through: fist eases back to a guard, hips/torso untwist and
        // the legs rise back up before releasing into the run.
        const armK = Math.min(1, dt*9);
        smoothArm(armR, POSE.recoverArmR, armK);
        smoothArm(armL, POSE.recoverArmL, armK);
        hips.rotation.y += (HIPS_TWIST.recover - hips.rotation.y) * Math.min(1, dt*8);
        torso.rotation.y += (TORSO_TWIST.recover - torso.rotation.y) * Math.min(1, dt*8);
        const d = LEG_DRIVE.recover, legK = Math.min(1, dt*8);
        legR.upper.rotation.x += (d.backUpper - legR.upper.rotation.x)*legK;
        legR.knee.rotation.x += (d.backKnee - legR.knee.rotation.x)*legK;
        legL.upper.rotation.x += (d.frontUpper - legL.upper.rotation.x)*legK;
        legL.knee.rotation.x += (d.frontKnee - legL.knee.rotation.x)*legK;
        punchDip += (d.dip - punchDip) * legK;
        if(attackT >= RECOVER_DUR){ attackPhase = 'none'; }
      }
    } else if(isJumping){
      hips.rotation.y += (HIPS_TWIST.idle - hips.rotation.y) * Math.min(1, dt*8);
      torso.rotation.y += (TORSO_TWIST.idle - torso.rotation.y) * Math.min(1, dt*8);
      punchDip += (0 - punchDip) * Math.min(1, dt*8);
      const k = Math.min(1, dt*14);
      armL.shoulder.rotation.x += (-0.6 - armL.shoulder.rotation.x)*k;
      armR.shoulder.rotation.x += (-0.6 - armR.shoulder.rotation.x)*k;
      armL.elbow.rotation.x += (1.1 - armL.elbow.rotation.x)*k;
      armR.elbow.rotation.x += (1.1 - armR.elbow.rotation.x)*k;
      armL.shoulder.rotation.z += (0 - armL.shoulder.rotation.z)*k;
      armR.shoulder.rotation.z += (0 - armR.shoulder.rotation.z)*k;
      armL.shoulder.rotation.y += (0 - armL.shoulder.rotation.y)*k;
      armR.shoulder.rotation.y += (0 - armR.shoulder.rotation.y)*k;
    } else {
      hips.rotation.y += (HIPS_TWIST.idle - hips.rotation.y) * Math.min(1, dt*8);
      torso.rotation.y += (TORSO_TWIST.idle - torso.rotation.y) * Math.min(1, dt*8);
      punchDip += (0 - punchDip) * Math.min(1, dt*8);
      applyRunStyleArmPose(gait, runCycle, dt);
    }

    const bob = isJumping ? 0 : Math.abs(Math.sin(runCycle*2))*gait.bob;
    const cheerProgress = Math.max(0, Math.min(1, 1 - killCelebrationT/KILL_CELEBRATION_DURATION));
    const cheerLift = killCelebrationT > 0 ? Math.sin(Math.PI*cheerProgress)*0.32 : 0;
    player.position.y = jumpY + bob + punchDip + cheerLift;
  }

  if(!running && caught) updateCaught(dt);
  updateParticles(dt, worldSpeed);

  // Camera follows (+ shake, FOV kick, speed lines)
  const camTarget = _camTarget.copy(player.position).add(camOffset);
  if(caught){ const z = Math.min(1, caughtT/1.2); camTarget.z -= 2.5*z; camTarget.y -= 2.2*z; }
  camera.position.sub(lastShake);
  camera.position.lerp(camTarget, 0.15);
  lastShake.set(0,0,0);
  if(shakeT > 0){
    shakeT -= dt;
    const a = shakeAmp * Math.min(1, shakeT/0.25 + 0.2);
    lastShake.set((Math.random()-0.5)*a, (Math.random()-0.5)*a, 0);
    if(shakeT <= 0) shakeAmp = 0;
  }
  camera.position.add(lastShake);
  fovKick *= Math.exp(-dt*3.5);
  const fovTarget = 60 + fovKick + (starT > 0 ? 10 : 0);
  if(Math.abs(camera.fov - fovTarget) > 0.01){
    camera.fov += (fovTarget - camera.fov)*Math.min(1, dt*8);
    camera.updateProjectionMatrix();
  }
  speedPulse *= Math.exp(-dt*1.6);
  const baseLines = running ? Math.min(0.45, Math.max(0, (speed - 12)*0.04)) : 0;
  const linesOp = Math.max(speedPulse, baseLines, starT > 0 ? 0.85 : 0).toFixed(2);
  if(linesOp !== lastLinesOp){ lastLinesOp = linesOp; speedlinesEl.style.opacity = linesOp; }
  camera.lookAt(_lookAt.copy(player.position).add(_lookOff));

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
