<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Endless Runner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
  :root{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#87ceeb; touch-action:none; }
  #c{ position:fixed; inset:0; }
  #score{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);

    position:fixed; left:0; bottom:0; width:45%; height:45%;

  }
  #joybase{
    position:fixed; width:120px; height:120px; border-radius:50%;

    left:35px; bottom:calc(35px + env(safe-area-inset-bottom,0px));
    pointer-events:none;
  }
  #joystick{
    position:fixed; width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,.8); border:2px solid rgba(255,255,255,.95);
    left:35px; bottom:calc(35px + env(safe-area-inset-bottom,0px));

    pointer-events:none;
  }
  #jumpbtn{
    position:fixed; right:30px; bottom:calc(40px + env(safe-area-inset-bottom,0px));

    color:#333; font:700 16px system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #attackbtn{
    position:fixed; right:38px; bottom:calc(140px + env(safe-area-inset-bottom,0px));
    width:68px; height:68px; border-radius:50%;
    background:rgba(255,70,70,.85); border:3px solid rgba(255,255,255,.9);
    color:#fff; font:700 15px system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #attackbtn.disabled{ opacity:.45; }
  #gameover{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;

  #coins{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px;
    color:#ffd400; font:800 22px system-ui,sans-serif; text-shadow:0 2px 6px rgba(0,0,0,.45);
    user-select:none; pointer-events:none; transform-origin:left center;
  }
  #coins.bump{ animation:bumpA .25s ease-out; }
  @keyframes bumpA{ 0%{transform:scale(1.4)} 100%{transform:scale(1)} }
  #combo{
    position:fixed; top:calc(118px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
    color:#fff; font:900 26px system-ui,sans-serif; letter-spacing:1px; opacity:0; white-space:nowrap;
    text-shadow:0 3px 0 #e67e22, 0 4px 10px rgba(0,0,0,.5); pointer-events:none; user-select:none;
    transition:opacity .25s;
  }
  #combo.bump{ animation:comboA .2s ease-out; }

  #starbar{
    position:fixed; top:calc(48px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
    width:170px; height:9px; border-radius:6px; background:rgba(0,0,0,.35); overflow:hidden;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #starfill{ height:100%; width:100%; background:linear-gradient(90deg,#ff4d4d,#ffe14d,#4dd2ff,#b04dff); }
  #speedlines{
    position:fixed; inset:0; pointer-events:none; opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,0) 0deg 5deg, rgba(255,255,255,.6) 5deg 5.7deg);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, transparent 30%, #000 80%);
    mask-image:radial-gradient(circle at 50% 45%, transparent 30%, #000 80%);
  }
  #vignette{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,20,40,.28) 100%); }
  #speedlines{ will-change:opacity; }
  #home, #skinscreen, #runscreen{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:space-between;
    padding:calc(5vh + env(safe-area-inset-top,0px)) 20px calc(3vh + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg, rgba(10,25,55,.6) 0%, rgba(10,25,55,.04) 32%, rgba(10,25,55,.04) 58%, rgba(10,25,55,.78) 100%);
    color:#fff; font-family:system-ui,sans-serif; text-align:center; user-select:none; -webkit-user-select:none;
  }
  #home{ justify-content:flex-end; }
  #skinscreen, #runscreen{ padding-top:calc(2vh + env(safe-area-inset-top,0px)); }
  body.home:not(.skinmode):not(.runmode) #home{ display:flex; }
  body.skinmode #skinscreen{ display:flex; }
  body.runmode #runscreen{ display:flex; }
  body.home > *:not(#c):not(#vignette):not(#home):not(#skinscreen):not(#runscreen){ visibility:hidden; }
  #home h1, #skinscreen h1{ margin:0; font:900 38px/1.1 system-ui,sans-serif; letter-spacing:3px; color:#ffd400;
    text-shadow:0 4px 0 #c98a00, 0 8px 18px rgba(0,0,0,.5); }
  #home .top, #home .bottom, #skinscreen .top, #skinscreen .bottom, #runscreen .top, #runscreen .bottom{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  #home .sub, #skinscreen .sub, #runscreen .sub{ font:600 14px system-ui,sans-serif; opacity:.9; margin-top:2px; }
  #home button, #skinscreen button, #runscreen button{ width:min(78vw,300px); border:none; border-radius:40px; font-family:system-ui,sans-serif; }
  #startbtn{ font-weight:800; font-size:24px; padding:16px 0; background:#ffd400; color:#333; box-shadow:0 5px 0 #c98a00; }

  #runpreviewstatus{ margin-top:7px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 14px;

  #runpreviewstatus .live-line{ display:flex; align-items:center; gap:7px; font:900 10px/1.2 system-ui,sans-serif; letter-spacing:1.15px; color:#bdf8e2; }
  #runpreviewstatus .live-dot{ width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:#6dffc0; box-shadow:0 0 10px rgba(109,255,192,.85); animation:previewPulse 1.25s ease-in-out infinite; }

  @media (prefers-reduced-motion:reduce){ #runpreviewstatus .live-dot{ animation:none; } }
  #runback{ font-weight:800; font-size:20px; padding:14px 0; background:#ffd400; color:#333; box-shadow:0 5px 0 #c98a00; }

  #skinback:active{ transform:translateY(3px); box-shadow:0 2px 0 #c98a00; }
  #skinname{ font-size:20px !important; font-weight:800 !important; opacity:1 !important; margin-top:0; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .skinrow{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; width:min(92vw,380px); }
  #skinscreen .skinbtn{ width:min(21vw,82px); min-height:82px; padding:7px 3px 6px; border-radius:16px; background:rgba(255,255,255,.12); color:#fff;

  #home .bottom{
    width:min(88vw,340px); box-sizing:border-box; padding:15px 18px 12px; margin-bottom:1vh; gap:10px;

  #home button{ width:100%; }
  #home #startbtn{ background:linear-gradient(135deg,#ffe778 0%,#ffc331 55%,#ff982d 100%); color:#3c2a11;

    #home .note{ min-height:2.4em; font-size:10px; line-height:1.35; }
    #skinscreen{ padding-left:10px; padding-right:10px; }
    .skinrow{ width:min(94vw,380px); gap:6px; }

  }
  @media (max-height:680px){
    #home .bottom{ padding-top:9px; padding-bottom:7px; gap:7px; }
    #home .note{ min-height:0; }
  }
  #flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.go{ animation:flashA .4s ease-out; }
  @keyframes flashA{ 0%{opacity:var(--fa,.6)} 100%{opacity:0} }
  .pop{
    position:fixed; transform:translate(-50%,-50%); color:#fff; font:900 26px system-ui,sans-serif;
    text-shadow:0 2px 0 #c0392b, 0 3px 8px rgba(0,0,0,.55); pointer-events:none; white-space:nowrap;
    animation:popUp .9s ease-out forwards;
  }
  .pop.big{ font-size:36px; color:#ffd400; }
  .pop.blue{ color:#7fe8ff; text-shadow:0 2px 0 #0a6a88, 0 3px 8px rgba(0,0,0,.55); }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,-30%) scale(.5); }
    15%{ opacity:1; transform:translate(-50%,-60%) scale(1.25); }
    100%{ opacity:0; transform:translate(-50%,-190%) scale(1); }
  }
  #speedup{
    position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:50%;
    transform:translateX(-50%) scale(.6);

  @keyframes speedupPop{
    0%   { opacity:0; transform:translateX(-50%) scale(.6); }
    15%  { opacity:1; transform:translateX(-50%) scale(1.15); }
    30%  { transform:translateX(-50%) scale(1); }
    80%  { opacity:1; transform:translateX(-50%) scale(1); }
    100% { opacity:0; transform:translateX(-50%) scale(1); }
  }
  #policetimer{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px;
    color:#7fb2ff; font:800 22px system-ui,sans-serif; text-shadow:0 2px 6px rgba(0,0,0,.45);
    user-select:none; pointer-events:none; opacity:0; transition:opacity .2s;
  }
  #policetimer.danger{ color:#ff5a4d; }
  #policewarn{
    position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:50%;
    transform:translateX(-50%) scale(.6);
    color:#7fb2ff; font:900 30px system-ui,sans-serif; letter-spacing:2px;
    text-shadow:0 3px 0 #0b2a6b, 0 4px 10px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; user-select:none; white-space:nowrap;
  }

</style>

<body class="home">
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="home">
  <div class="home-total" aria-label="獲得コイン合計">🪙 累計 <strong id="homecoinstotal">0</strong></div>
  <div class="bottom">
    <button id="startbtn">スタート</button>
    <button id="skinbtn">スキン</button>
    <button id="runstylebtn">走り方：ノーマル</button>
    <button id="litebtn">軽量化：OFF</button>
    <div class="note" id="litenote"></div>
  </div>
</div>
<div id="skinscreen">
  <div class="top">
    <div class="sub" id="skinname"></div>
  </div>
  <div class="bottom">
    <div class="skinrow" id="skinrow"></div>
    <button id="skinback">もどる</button>
  </div>
</div>
<div id="runscreen">
  <div class="top">
    <div class="sub">走り方を選択</div>
    <div id="runpreviewstatus" aria-live="polite">
      <div class="live-line"><span class="live-dot"></span><span>LIVE PREVIEW</span><strong id="runpreviewname">ノーマル</strong></div>
      <small class="hint">カードをタップすると主人公の動きが切り替わります</small>
    </div>
  </div>
  <div class="bottom">
    <div id="runstylegrid"></div>
    <button id="runback">もどる</button>
  </div>
</div>
<div id="score">0 m</div>
<div id="speedup">スピードアップ！</div>
<div id="policetimer">🚓 45</div>
<div id="policewarn">🚓 警察が追ってくる！</div>
<div id="speedlines"></div>
<div id="flash"></div>
<div id="coins">🪙 0</div>
<div id="combo"></div>
<div id="starbar"><div id="starfill"></div></div>
<div id="joyzone"></div>
<div id="joybase"></div>
<div id="joystick"></div>
<div id="attackbtn">殴</div>
<div id="jumpbtn">JUMP</div>
<div id="gameover">
  <div>ゲームオーバー</div>
  <div id="finalscore" style="font-size:18px;"></div>
  <button id="retry">もう一度</button>
  <button id="homebtn">ホームへ</button>
</div>

<script>
// ---------- Setup ----------
let canvas = document.getElementById('c');
// ---- Quality mode: 通常 (best looking) or 軽量化 (fast on old phones) ----
// 通常  : full-res, anti-aliasing, soft shadows.  軽量化: 1x res, no AA, cheaper shadows,
// fewer effects, plus automatic resolution scaling when the frame rate drops.
const Q = { light:false };
try{ Q.light = localStorage.getItem('er_light') === '1'; }catch(e){}
const PR_MIN = 0.6;
let PR_MAX = 1, curPR = 1, shadowsOff = false;
let renderer = null, rendererLight = null;
function makeRenderer(light){
  if(renderer){
    // Anti-aliasing can't change on a live GL context, so swap in a fresh canvas.
    const old = canvas, nc = document.createElement('canvas');
    nc.id = 'c';
    old.parentNode.replaceChild(nc, old);
    canvas = nc;
    try{ renderer.dispose(); renderer.forceContextLoss(); }catch(e){}
  }
  renderer = new THREE.WebGLRenderer({canvas, antialias:!light, powerPreference:'high-performance'});
  rendererLight = light;
  PR_MAX = light ? 1 : Math.min(devicePixelRatio, 2);
  curPR = PR_MAX;
  renderer.setPixelRatio(curPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = light ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
}
makeRenderer(Q.light);

const scene = new THREE.Scene();
// Sky: vertical gradient + soft clouds, painted to a canvas that matches the
// screen aspect (so the clouds never stretch) and rebuilt on resize.
scene.background = new THREE.Color(0xcfe6f5);
scene.fog = new THREE.Fog(0xcfe6f5, 24, Q.light ? 62 : 75); // fog = horizon colour, so the road melts into the sky
let skyTex = null;
function buildSky(){
  const w = 512, h = Math.max(256, Math.min(1024, Math.round(512*innerHeight/innerWidth)));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#3f86d6'); grad.addColorStop(0.32,'#7fbdf0');
  grad.addColorStop(0.55,'#cfe6f5'); grad.addColorStop(1,'#e8f4fb');
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  let seed = 7; const r = ()=> (seed = (seed*16807)%2147483647)/2147483647;
  for(let i=0;i<9;i++){
    const cx = r()*w, cy = h*(0.06 + r()*0.34), sc = 0.7 + r()*0.9;
    for(let j=0;j<6;j++){
      const rad = (28 + r()*30)*sc, x = cx + (j-2.5)*22*sc, y = cy + (r()-0.5)*14*sc;
      const rg = g.createRadialGradient(x,y,0,x,y,rad);
      rg.addColorStop(0,'rgba(255,255,255,0.55)'); rg.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle = rg; g.beginPath(); g.ellipse(x,y,rad*1.5,rad*0.7,0,0,Math.PI*2); g.fill();
    }
  }
  if(skyTex) skyTex.dispose();
  skyTex = new THREE.CanvasTexture(c);
  scene.background = skyTex;
}
buildSky();

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  if(typeof buildSky === 'function') buildSky();
}
addEventListener('resize', resize);
resize();

// Lights
// Sky/ground hemisphere light gives shaded sides a cool tint and lit tops a warm bounce.
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x8c8578, 0.75));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
sun.position.set(5,10,5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-15; sun.shadow.camera.right=15;
sun.shadow.camera.top=15; sun.shadow.camera.bottom=-15;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
// Faint cool fill from the opposite side so shadowed faces aren't flat.
const fill = new THREE.DirectionalLight(0xaad0ff, 0.25);
fill.position.set(-6,4,-5);
scene.add(fill);

// Applies everything about the quality mode that isn't the renderer itself.
const texList = [];
function qAniso(){ return Q.light ? 2 : Math.min(8, renderer.capabilities.getMaxAnisotropy()); }
function applyQualityState(light){
  scene.fog.far = light ? 62 : 75;
  fill.visible = !light;
  if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  const ms = light ? 1024 : 2048;
  sun.shadow.mapSize.set(ms, ms);
  sun.castShadow = true; shadowsOff = false;
  const v = document.getElementById('vignette'); if(v) v.style.display = light ? 'none' : '';
  texList.forEach(t=>{ t.anisotropy = qAniso(); t.needsUpdate = true; });
}
function applyQuality(light){
  const changed = rendererLight !== light;
  Q.light = light;
  if(changed) makeRenderer(light);
  applyQualityState(light);
  resize();
}
applyQualityState(Q.light);

// ---------- Ground (detailed city road) ----------
const LANE_WIDTH = 8; // slightly wide track
const SEG_LEN = 20;
const SEG_COUNT = 6;
const PPM = 32; // texture pixels per metre

function mkCanvas(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function canvasTex(c, rx, ry){
  const t = new THREE.CanvasTexture(c);
  if(rx){ t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  t.anisotropy = qAniso(); texList.push(t);
  return t;
}

// Asphalt: tonal blotches, tyre-wear bands, aggregate speckle, repair patches,
// cracks, oil stains — plus worn double-yellow / dashed-white / edge markings.
function makeAsphaltTexture(variant){
  const W = LANE_WIDTH*PPM, H = SEG_LEN*PPM;
  const c = mkCanvas(W,H), x = c.getContext('2d');
  x.fillStyle = '#3b3e44'; x.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){
    x.fillStyle = 'rgba(' + (Math.random()<0.5 ? '20,20,24' : '80,82,88') + ',' + rnd(0.05,0.12).toFixed(3) + ')';
    x.beginPath(); x.arc(rnd(0,W), rnd(0,H), rnd(20,70), 0, Math.PI*2); x.fill();
  }
  [W*0.25, W*0.75].forEach(cx=>{
    [-12,12].forEach(off=>{
      const g = x.createLinearGradient(cx+off-9,0,cx+off+9,0);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.5,'rgba(0,0,0,0.16)'); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(cx+off-9,0,18,H);
    });
  });
  for(let i=0;i<14000;i++){
    const v = Math.floor(rnd(30,110));
    x.fillStyle = 'rgba(' + v + ',' + v + ',' + (v+4) + ',' + rnd(0.25,0.6).toFixed(2) + ')';
    x.fillRect(Math.random()*W, Math.random()*H, 1+Math.random()*1.5, 1+Math.random()*1.5);
  }
  for(let i=0;i<1+(variant%3);i++){
    const pw = rnd(50,110), ph = rnd(60,150);
    x.fillStyle = 'rgba(18,19,22,0.35)';
    x.fillRect(rnd(10,W-pw-10), rnd(30,H-ph-30), pw, ph);
    x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = 1;
    x.strokeRect(rnd(10,W-pw-10)|0, rnd(30,H-ph-30)|0, pw, ph);
  }
  x.strokeStyle = 'rgba(12,12,14,0.7)'; x.lineWidth = 1;
  for(let i=0;i<5+variant*2;i++){
    let px = rnd(10,W-10), py = rnd(20,H-20);
    x.beginPath(); x.moveTo(px,py);
    const n = 6 + Math.floor(Math.random()*8);
    for(let k=0;k<n;k++){ px += rnd(-14,14); py += rnd(6,20); x.lineTo(px,py); }
    x.stroke();
  }
  for(let i=0;i<3;i++){
    const g = x.createRadialGradient(0,0,2,0,0,rnd(14,26));
    g.addColorStop(0,'rgba(10,10,14,0.55)'); g.addColorStop(1,'rgba(10,10,14,0)');
    x.save(); x.translate(rnd(20,W-20), rnd(20,H-20)); x.scale(1, rnd(1.2,2.2));
    x.fillStyle = g; x.fillRect(-30,-30,60,60); x.restore();
  }
  // ---- markings (periodic, so they line up across segments) ----
  const cx = W/2;
  function vline(px, wpx, color, dashPx, gapPx){
    x.fillStyle = color;
    if(!dashPx) x.fillRect(px-wpx/2, 0, wpx, H);
    else for(let y=0;y<H;y+=dashPx+gapPx) x.fillRect(px-wpx/2, y, wpx, dashPx);
    for(let i=0;i<220;i++){ // wear: asphalt showing through the paint
      x.fillStyle = 'rgba(59,62,68,' + rnd(0.3,0.75).toFixed(2) + ')';
      x.fillRect(px-wpx/2+Math.random()*wpx, Math.random()*H, rnd(1,3), rnd(1,4));
    }
  }
  vline(cx-5, 4, '#e8b800');            // double yellow centre line
  vline(cx+5, 4, '#e8b800');
  vline(cx-3.65*PPM, 5, '#e9e9e4');     // solid white edge lines
  vline(cx+3.65*PPM, 5, '#e9e9e4');
  vline(cx-2.0*PPM, 4, '#e9e9e4', 64, 96); // dashed white lane lines
  vline(cx+2.0*PPM, 4, '#e9e9e4', 64, 96);
  return canvasTex(c);
}

function makeSidewalkTexture(){
  const W = 3*PPM, H = SEG_LEN*PPM;
  const c = mkCanvas(W,H), x = c.getContext('2d');
  for(let r=0;r<SEG_LEN;r++) for(let k=0;k<3;k++){
    const v = Math.floor(rnd(190,212));
    x.fillStyle = 'rgb(' + v + ',' + (v-2) + ',' + (v-9) + ')';
    x.fillRect(k*PPM, r*PPM, PPM, PPM);
  }
  x.fillStyle = '#9d9a91';
  for(let r=0;r<=SEG_LEN;r++) x.fillRect(0, r*PPM-1, W, 2);
  for(let k=0;k<=3;k++) x.fillRect(k*PPM-1, 0, 2, H);
  for(let i=0;i<2500;i++){
    const v = Math.floor(rnd(120,200));
    x.fillStyle = 'rgba(' + v + ',' + v + ',' + (v-6) + ',0.4)';
    x.fillRect(Math.random()*W, Math.random()*H, 1, 1);
  }
  for(let i=0;i<6;i++){
    x.fillStyle = 'rgba(70,66,58,' + rnd(0.12,0.25).toFixed(2) + ')';
    x.beginPath(); x.arc(rnd(0,W), rnd(0,H), rnd(2,6), 0, Math.PI*2); x.fill();
  }
  return canvasTex(c);
}

function makeFacadeMat(base, litChance){
  const c = mkCanvas(128,256), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,128,256);
  for(let i=0;i<900;i++){
    x.fillStyle = 'rgba(0,0,0,' + rnd(0.02,0.08).toFixed(3) + ')';
    x.fillRect(Math.random()*128, Math.random()*256, 2, 2);
  }
  const cols = 4, rows = 10, cw = 128/cols, rh = 256/rows;
  for(let r=0;r<rows-1;r++) for(let k=0;k<cols;k++){
    const wx = k*cw + cw*0.2, wy = r*rh + rh*0.22, ww = cw*0.6, wh = rh*0.55;
    const on = Math.random() < litChance;
    x.fillStyle = on ? '#ffe9a8' : (Math.random()<0.5 ? '#3e5a78' : '#2d4560');
    x.fillRect(wx,wy,ww,wh);
    x.fillStyle = 'rgba(255,255,255,0.3)'; x.fillRect(wx,wy,ww,2);
    x.fillStyle = 'rgba(0,0,0,0.3)'; x.fillRect(wx,wy+wh-2,ww,2);
    x.fillRect(wx+ww/2-0.5, wy, 1, wh);
  }
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 256-rh*0.95, 128, rh*0.95);
  x.fillStyle = 'rgba(255,235,170,0.55)'; x.fillRect(10, 256-rh*0.7, 108, rh*0.4);
  return new THREE.MeshStandardMaterial({map:canvasTex(c), roughness:0.9});
}

const yellowLightMat = new THREE.MeshStandardMaterial({color:0x555500, roughness:0.4});

function makeArrowGeo(){
  const sh = new THREE.Shape();
  sh.moveTo(-0.18,-0.9); sh.lineTo(0.18,-0.9); sh.lineTo(0.18,0.1); sh.lineTo(0.5,0.1);
  sh.lineTo(0,0.9); sh.lineTo(-0.5,0.1); sh.lineTo(-0.18,0.1); sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, {depth:0.02, bevelEnabled:false});
  geo.rotateX(-Math.PI/2); // arrow tip points down the road (-Z)
  return geo;
}
const arrowGeo = makeArrowGeo();

function addCrosswalk(g, z){
  // Zebra stripes run parallel to traffic, spaced across the road
  const stripeW = 0.6, gapW = 0.45, stripeLen = 3.2;
  const count = 7;
  const totalW = count*stripeW + (count-1)*gapW;
  let x = -totalW/2 + stripeW/2;
  const geo = new THREE.BoxGeometry(stripeW, 0.04, stripeLen);
  for(let i=0;i<count;i++){
    const stripe = new THREE.Mesh(geo, crosswalkMat);
    stripe.position.set(x, 0.025, z);
    stripe.receiveShadow = true;
    g.add(stripe);
    x += stripeW+gapW;
  }
  // Stop line for the oncoming lane, just before the crossing
  const stop = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH/2-0.5, 0.04, 0.35), crosswalkMat);
  stop.position.set(-LANE_WIDTH/4-0.05, 0.025, z - stripeLen/2 - 0.9);
  g.add(stop);
  // Yellow tactile paving on both sidewalk ends of the crossing
  [-1,1].forEach(sd=>{
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.02, stripeLen), tactileMat);
    strip.position.set(sd*(LANE_WIDTH/2+0.75), 0.19, z);
    g.add(strip);
  });
}

const signalHousingMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.4, metalness:0.3});
const signalVisorMat = new THREE.MeshStandardMaterial({color:0x151515, roughness:0.5, metalness:0.2});
const signalLensRingMat = new THREE.MeshStandardMaterial({color:0x0d0d0d, roughness:0.5});

function addTrafficSignal(g, z, sideX){
  const signal = new THREE.Group();
  // Pole with a flared base and a small cap, instead of a bare cylinder
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,3.4,12), poleMat);
  pole.position.y = 1.7;
  pole.castShadow = true;
  signal.add(pole);
  const poleBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.19,0.18,12), poleMat);
  poleBase.position.y = 0.09;
  poleBase.castShadow = true;
  signal.add(poleBase);
  const poleCap = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10), poleMat);
  poleCap.position.y = 3.42;
  signal.add(poleCap);

  // Horizontal mounting arm carrying the signal head off the pole
  const armLen = 0.35;
  const mountArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,armLen,10), poleMat);
  mountArm.rotation.z = Math.PI/2;
  mountArm.position.set(0, 3.55, 0.02+armLen/2);
  signal.add(mountArm);

  // Signal head: a black housing box with three round lamp cells, each
  // with its own recessed lens ring and a hooded visor to block glare —
  // the detail that makes a real traffic light read as a real object.
  const headZ = armLen + 0.22;
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.46,1.2,0.36), signalHousingMat);
  box.position.set(0, 3.55, headZ);
  box.castShadow = true;
  signal.add(box);
  const backboard = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.35,0.05), signalHousingMat);
  backboard.position.set(0, 3.55, headZ-0.2);
  signal.add(backboard);

  [{mat:redLightMat,y:3.87},{mat:yellowLightMat,y:3.55},{mat:greenLightMat,y:3.23}].forEach(l=>{
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.145,0.025,8,16), signalLensRingMat);
    ring.position.set(0, l.y, headZ+0.185);
    signal.add(ring);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.13,12,12), l.mat);
    lamp.position.set(0, l.y, headZ+0.2);
    signal.add(lamp);
    // Hooded visor above each lens to shade it from the sun, angled down
    const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.16,12,1,true,0,Math.PI), signalVisorMat);
    visor.rotation.x = Math.PI/2;
    visor.rotation.z = Math.PI;
    visor.position.set(0, l.y+0.02, headZ+0.24);
    signal.add(visor);
  });

  signal.position.set(sideX, 0.18, z);
  g.add(signal);
}

function addStreetLamp(g, z, side){
  const lamp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.11,5.2,10), lampPoleMat);
  pole.position.y = 2.6; pole.castShadow = true;
  lamp.add(pole);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.2,0.4,10), lampPoleMat);
  base.position.y = 0.2;
  lamp.add(base);
  const armLen = 1.7;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(armLen,0.09,0.09), lampPoleMat);
  arm.position.set(-side*armLen/2, 5.15, 0); // reaches out over the road
  lamp.add(arm);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.12,0.32), lampPoleMat);
  head.position.set(-side*(armLen-0.1), 5.1, 0);
  lamp.add(head);
  const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.04,0.22), bulbMat);
  bulb.position.set(-side*(armLen-0.1), 5.03, 0);
  lamp.add(bulb);
  lamp.position.set(side*(LANE_WIDTH/2+0.9), 0.18, z);
  g.add(lamp);
}

function addTree(g, x, z){
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.24,1.7,8), trunkMat);
  trunk.position.y = 0.85; trunk.castShadow = true;
  t.add(trunk);
  const lm = leafMats[Math.floor(Math.random()*leafMats.length)];
  const f1 = new THREE.Mesh(new THREE.SphereGeometry(1.15,10,8), lm);
  f1.position.y = 2.5; f1.castShadow = true;
  t.add(f1);
  const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.85,10,8), lm);
  f2.position.set(rnd(-0.3,0.3), 3.4, rnd(-0.3,0.3)); f2.castShadow = true;
  t.add(f2);
  const sc = rnd(0.7,0.9);
  t.scale.set(sc,sc,sc);
  t.position.set(x, 0.18, z);
  g.add(t);
}

function addBuilding(g, side, zc){
  const w = rnd(5,8), d = rnd(8.8,10), h = rnd(9,20);
  const fm = facadeMats[Math.floor(Math.random()*facadeMats.length)];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), [fm,fm,roofMat,roofMat,fm,fm]);
  // Flush against the back edge of the sidewalk (x = LANE_WIDTH/2 + 3.4), forming a street wall
  mesh.position.set(side*(LANE_WIDTH/2 + 3.4 + w/2), h/2, zc);
  g.add(mesh);
}

function addManhole(g, x, z){
  const cover = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.03,20), manholeRingMat);
  cover.position.set(x, 0.02, z);
  g.add(cover);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.035,20), manholeMat);
  inner.position.set(x, 0.022, z);
  g.add(inner);
}

function addHydrant(g, x, z){
  const h = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.19,0.7,10), hydrantMat);
  body.position.y = 0.35; body.castShadow = true;
  h.add(body);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.17,10,8), hydrantMat);
  cap.position.y = 0.72;
  h.add(cap);
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.5,8), hydrantMat);
  nozzle.rotation.z = Math.PI/2; nozzle.position.y = 0.45;
  h.add(nozzle);
  h.position.set(x, 0.18, z);
  g.add(h);
}

// Tiny parts (bolts, lights, handles) can't be seen in a shadow, so they don't
// cast one. Cuts the shadow-pass draw calls a lot on cars, buildings and props.
function trimShadows(obj){
  obj.traverse(m=>{
    if(!m.isMesh || !m.castShadow) return;
    const g = m.geometry;
    if(!g.boundingBox) g.computeBoundingBox();
    const b = g.boundingBox;
    const size = Math.max(b.max.x-b.min.x, b.max.y-b.min.y, b.max.z-b.min.z);
    if(size < 0.45) m.castShadow = false;
  });
}
// Enemies and cars build fresh geometry on every spawn; free it when they go.
function disposeGeos(obj){
  obj.traverse(m=>{ if(m.isMesh && m.geometry) m.geometry.dispose(); });
}

const groundSegs = [];
for(let i=0;i<SEG_COUNT;i++){
  const g = new THREE.Group();
  // Asphalt with baked-in markings (3 texture variants so wear doesn't visibly repeat)
  const track = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH, 0.4, SEG_LEN), asphaltMats[i%3]);
  track.position.y = -0.2;
  track.receiveShadow = true;
  g.add(track);
  [-1,1].forEach(sd=>{
    // Kerb and paved sidewalk
    const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.18,SEG_LEN), curbMat);
    curb.position.set(sd*(LANE_WIDTH/2+0.2), 0.09, 0);
    curb.receiveShadow = true;
    g.add(curb);
    const walk = new THREE.Mesh(new THREE.BoxGeometry(3,0.18,SEG_LEN), sidewalkMat);
    walk.position.set(sd*(LANE_WIDTH/2+0.4+1.5), 0.09, 0);
    walk.receiveShadow = true;
    g.add(walk);
    // A street tree at the back of the sidewalk, buildings right behind it
    if(Math.random() < 0.7) addTree(g, sd*(LANE_WIDTH/2+0.4+2.5), rnd(-9,-6));
    [-5,5].forEach(zc=>addBuilding(g, sd, zc));
  });
  // One lamp per segment, alternating sides
  addStreetLamp(g, 4, i%2===0 ? -1 : 1);
  // Occasional road details
  if(i === 0 || i === 2) addManhole(g, rnd(-2.6,2.6), rnd(-6,6));
  if(i === 1 || i === 4){
    [-1,1].forEach(sd=>{
      const arrow = new THREE.Mesh(arrowGeo, crosswalkMat);
      arrow.position.set(sd*1.0, 0.005, -4);
      g.add(arrow);
    });
  }
  if(i === 2) addHydrant(g, -(LANE_WIDTH/2+2.4), -6);
  // One segment out of every loop gets a crosswalk + traffic lights,
  // so they show up occasionally as the road scrolls by.
  if(i === 3){
    addCrosswalk(g, 0);
    addTrafficSignal(g, -3.2, -(LANE_WIDTH/2+1.0));
    addTrafficSignal(g, -3.2, LANE_WIDTH/2+1.0);
  }
  g.position.z = -i*SEG_LEN;
  scene.add(g);
  trimShadows(g);
  groundSegs.push(g);
}

// ---------- Jointed character (reusable rig factory) ----------
const yellow = new THREE.MeshStandardMaterial({color:0xffd400, roughness:0.55});
const yellowDark = new THREE.MeshStandardMaterial({color:0xe6b800, roughness:0.55});
const enemyRed = new THREE.MeshStandardMaterial({color:0xd93b3b, roughness:0.55});

function limb(radius,h,mat){
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(radius, radius*0.85, h, 12);
  geo.translate(0,-h/2,0); // pivot at top
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  g.add(mesh);
  // joint ball at the pivot (top)
  const joint = new THREE.Mesh(new THREE.SphereGeometry(radius*1.05,12,12), mat);
  joint.castShadow = true;
  g.add(joint);
  return g;
}

function buildCharacter(mat){
  const group = new THREE.Group();

  // Torso (rounded)
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16), mat);
  torso.scale.set(0.85,1.05,0.7);
  torso.position.y = 1.55;
  torso.castShadow = true;
  group.add(torso);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), mat);
  head.position.y = 2.35;
  head.castShadow = true;
  group.add(head);

  // Hips (root for legs)
  const hips = new THREE.Group();
  hips.position.y = 1.05;
  group.add(hips);

  function makeLeg(sideX){
    const upper = limb(0.18,0.55,mat); // thigh
    upper.position.set(sideX,0,0);
    const knee = new THREE.Group();

const CONE_R_BOTTOM = 0.30, CONE_R_TOP = 0.045, CONE_H = 1.0, CONE_BASE_H = 0.14, CONE_BASE_SIZE = 0.6;
const CONE_HIT_RADIUS = CONE_R_BOTTOM + 0.15;
// Two-stage taper: a wider, gently-flared lower section and a narrower
// upper section, meeting at a shoulder — a real cone bellies out near the
// base rather than tapering in one straight line.
const CONE_MID_R = CONE_R_BOTTOM*0.62, CONE_LOWER_H = CONE_H*0.42, CONE_UPPER_H = CONE_H*0.55, CONE_TIP_H = CONE_H*0.03;
function coneRadiusAt(y){
  if(y <= CONE_LOWER_H) return CONE_R_BOTTOM + (CONE_MID_R-CONE_R_BOTTOM)*(y/CONE_LOWER_H);
  if(y <= CONE_LOWER_H+CONE_UPPER_H) return CONE_MID_R + (CONE_R_TOP-CONE_MID_R)*((y-CONE_LOWER_H)/CONE_UPPER_H);
  return CONE_R_TOP;
}

function buildCone(){
  const g = new THREE.Group();

  // Molded rubber base: raised lip, a shallow top face, and four grip ribs
  // radiating out like a real road-cone base does.
  const baseLip = new THREE.Mesh(new THREE.BoxGeometry(CONE_BASE_SIZE, CONE_BASE_H*0.35, CONE_BASE_SIZE), coneBaseMat);
  baseLip.position.y = CONE_BASE_H*0.35/2;
  baseLip.castShadow = true;
  baseLip.receiveShadow = true;
  g.add(baseLip);
  const base = new THREE.Mesh(new THREE.BoxGeometry(CONE_BASE_SIZE*0.86, CONE_BASE_H*0.75, CONE_BASE_SIZE*0.86), coneBaseMat);
  base.position.y = CONE_BASE_H*0.35 + CONE_BASE_H*0.75/2;
  base.castShadow = true;
  g.add(base);
  [0, Math.PI/2].forEach(rot=>{
    const rib = new THREE.Mesh(new THREE.BoxGeometry(CONE_BASE_SIZE*0.94, 0.025, 0.05), coneBaseRibMat);
    rib.rotation.y = rot;
    rib.position.y = CONE_BASE_H*0.35 + CONE_BASE_H*0.75 + 0.005;
    g.add(rib);
  });

  // Cone body built from two stacked frustums so the silhouette bellies
  // near the base and narrows sharply toward the top, then a small flat
  // (not pointed) tip — real safety cones are truncated, not knife-sharp.
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(CONE_MID_R, CONE_R_BOTTOM, CONE_LOWER_H, 24), coneOrangeMat);
  lower.position.y = CONE_BASE_H + CONE_LOWER_H/2;
  lower.castShadow = true;
  g.add(lower);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(CONE_R_TOP, CONE_MID_R, CONE_UPPER_H, 24), coneOrangeMat);
  upper.position.y = CONE_BASE_H + CONE_LOWER_H + CONE_UPPER_H/2;
  upper.castShadow = true;
  g.add(upper);
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(CONE_R_TOP*0.7, CONE_R_TOP, CONE_TIP_H, 16), coneOrangeDarkMat);
  tip.position.y = CONE_BASE_H + CONE_LOWER_H + CONE_UPPER_H + CONE_TIP_H/2;
  tip.castShadow = true;
  g.add(tip);
  // Subtle seam line where the two frustums meet, like a molding seam
  const seam = new THREE.Mesh(new THREE.TorusGeometry(CONE_MID_R+0.002, 0.006, 6, 20), coneOrangeDarkMat);
  seam.rotation.x = Math.PI/2;
  seam.position.y = CONE_BASE_H + CONE_LOWER_H;
  g.add(seam);

  // Reflective white bands — radius interpolated against the true two-stage
  // taper so each band hugs the surface instead of poking through it.
  function addStripe(y0, y1){
    const h = y1 - y0;
    const geo = new THREE.CylinderGeometry(coneRadiusAt(y1)+0.008, coneRadiusAt(y0)+0.008, h, 24);
    const band = new THREE.Mesh(geo, coneWhiteMat);
    band.position.y = CONE_BASE_H + y0 + h/2;
    band.castShadow = true;
    g.add(band);
  }
  addStripe(CONE_H*0.36, CONE_H*0.52);
  addStripe(CONE_H*0.66, CONE_H*0.82);

  return g;
}

// ---------- Obstacles: oil drums ----------
const barrelBodyMat = new THREE.MeshStandardMaterial({color:0xc23b1f, roughness:0.55, metalness:0.3});
const barrelBandMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.6, metalness:0.3});
const barrelRustMat = new THREE.MeshStandardMaterial({color:0x6b3a1f, roughness:0.85});
const barrelLidMat = new THREE.MeshStandardMaterial({color:0x8f2a16, roughness:0.5, metalness:0.35});
const barrelWarnMat = new THREE.MeshStandardMaterial({color:0xf5d000, roughness:0.5});
const BARREL_R = 0.28, BARREL_H = 0.85;
const BARREL_HIT_RADIUS = BARREL_R + 0.15;

function buildBarrel(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(BARREL_R, BARREL_R*0.96, BARREL_H, 18), barrelBodyMat);
  body.position.y = BARREL_H/2;
  body.castShadow = true;
  g.add(body);
  // Rolling bands near top, middle and bottom, like a real steel drum
  [0.14, 0.5, 0.86].forEach(f=>{
    const band = new THREE.Mesh(new THREE.CylinderGeometry(BARREL_R*1.04, BARREL_R*1.04, 0.06, 18), barrelBandMat);
    band.position.y = BARREL_H*f;
    g.add(band);
  });
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(BARREL_R*0.92, BARREL_R*0.92, 0.05, 18), barrelLidMat);
  lid.position.y = BARREL_H + 0.02;
  lid.castShadow = true;
  g.add(lid);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(BARREL_R*0.95, 0.02, 6, 18), barrelBandMat);
  rim.rotation.x = Math.PI/2;
  rim.position.y = BARREL_H + 0.045;
  g.add(rim);
  // A rust streak and a warning stripe so it doesn't look like a plain tube
  const rust = new THREE.Mesh(new THREE.PlaneGeometry(0.1, BARREL_H*0.5), barrelRustMat);
  rust.position.set(0, BARREL_H*0.3, BARREL_R*0.99);
  g.add(rust);
  const warn = new THREE.Mesh(new THREE.CylinderGeometry(BARREL_R*1.005, BARREL_R*1.005, 0.1, 18, 1, true, 0, Math.PI*0.6), barrelWarnMat);
  warn.position.y = BARREL_H*0.68;
  warn.rotation.y = Math.random()*Math.PI*2;
  g.add(warn);
  return g;
}

// ---------- Obstacles: full-width road barricade (jump-only) ----------
const barrierPlankMat = new THREE.MeshStandardMaterial({color:0xf0b400, roughness:0.5});
const barrierStripeMat = new THREE.MeshStandardMaterial({color:0x191919, roughness:0.55});
const barrierLegMat = new THREE.MeshStandardMaterial({color:0x2c2c2e, roughness:0.55, metalness:0.3});
const barrierLightMat = new THREE.MeshStandardMaterial({color:0xff3b30, emissive:0x661010, emissiveIntensity:0.6});

function buildBarrier(){
  const g = new THREE.Group();
  const beamLen = LANE_WIDTH + 0.6;
  const beamY = 0.62, beamH = 0.34;

  // Horizontal beam with alternating diagonal-look yellow/black stripes
  // (built from square segments so it still reads clearly at a distance)
  const segLen = 0.42;
  const segCount = Math.ceil(beamLen/segLen);
  for(let i=0;i<segCount;i++){
    const sx = -beamLen/2 + (i+0.5)*segLen;
    const seg = new THREE.Mesh(new THREE.BoxGeometry(Math.min(segLen,beamLen-i*segLen), beamH, 0.12),
      i%2===0 ? barrierPlankMat : barrierStripeMat);
    seg.position.set(sx, beamY, 0);
    seg.castShadow = true;
    g.add(seg);
  }
  const beamFrame = new THREE.Mesh(new THREE.BoxGeometry(beamLen, 0.05, 0.14), barrierLegMat);
  beamFrame.position.set(0, beamY+beamH/2, 0);
  g.add(beamFrame);

  // A-frame trestle legs at both ends and the middle, holding the beam up
  [-beamLen/2+0.35, 0, beamLen/2-0.35].forEach(lx=>{
    [-1,1].forEach(dir=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.85,0.08), barrierLegMat);
      leg.position.set(lx, 0.42, dir*0.28);
      leg.rotation.x = dir*0.32;
      leg.castShadow = true;
      g.add(leg);
    });
    const footBar = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.08,0.62), barrierLegMat);
    footBar.position.set(lx, 0.05, 0);
    g.add(footBar);
  });

  // Small reflective warning lights at both ends, facing the player
  [-beamLen/2+0.18, beamLen/2-0.18].forEach(lx=>{
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), barrierLightMat);
    light.position.set(lx, beamY, 0.09);
    g.add(light);
  });
  return g;
}

// ---------- Obstacles: pothole (low, must be jumped or sidestepped) ----------
const potholeDarkMat = new THREE.MeshStandardMaterial({color:0x0a0a0b, roughness:1});
const potholeMidMat = new THREE.MeshStandardMaterial({color:0x1d1b1a, roughness:1});
const potholeRimMat = new THREE.MeshStandardMaterial({color:0x4a4846, roughness:0.95});
const potholeChunkMat = new THREE.MeshStandardMaterial({color:0x5c5956, roughness:0.95});
const potholeCrackMat = new THREE.MeshStandardMaterial({color:0x151414, roughness:1});
const potholeWaterMat = new THREE.MeshStandardMaterial({color:0x2c3a44, roughness:0.1, metalness:0.4});
const POTHOLE_R = 0.75;
const POTHOLE_HIT_RADIUS = POTHOLE_R + 0.1;

function buildPothole(){
  const g = new THREE.Group();
  // Squashed, slightly lumpy oval so it doesn't look like a perfect disc
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(POTHOLE_R*1.12, POTHOLE_R*1.15, 0.03, 20), potholeRimMat);
  outer.scale.z = 0.85;
  outer.position.y = 0.03;
  outer.receiveShadow = true;
  g.add(outer);
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(POTHOLE_R*0.9, POTHOLE_R*0.9, 0.03, 20), potholeMidMat);
  mid.scale.z = 0.85;
  mid.position.y = 0.05;
  g.add(mid);
  const pit = new THREE.Mesh(new THREE.CylinderGeometry(POTHOLE_R*0.62, POTHOLE_R*0.62, 0.03, 18), potholeDarkMat);
  pit.scale.z = 0.85;
  pit.position.y = 0.07;
  g.add(pit);
  // Puddle of dirty water in the deepest part, catching the light
  const puddle = new THREE.Mesh(new THREE.CylinderGeometry(POTHOLE_R*0.36, POTHOLE_R*0.36, 0.01, 16), potholeWaterMat);
  puddle.scale.z = 0.8;
  puddle.position.set(POTHOLE_R*0.1, 0.09, 0);
  g.add(puddle);
  // Broken asphalt chunks scattered around the rim
  for(let i=0;i<11;i++){
    const a = (i/11)*Math.PI*2 + Math.random()*0.4;
    const r = POTHOLE_R*(1.0 + Math.random()*0.28);
    const s = 0.08 + Math.random()*0.12;
    const chunk = new THREE.Mesh(new THREE.BoxGeometry(s, 0.05+Math.random()*0.05, s*(0.7+Math.random()*0.6)), potholeChunkMat);
    chunk.position.set(Math.cos(a)*r, 0.06, Math.sin(a)*r*0.85);
    chunk.rotation.y = Math.random()*Math.PI;
    chunk.castShadow = true;
    g.add(chunk);
  }
  // Hairline cracks radiating outward
  for(let i=0;i<5;i++){
    const a = Math.random()*Math.PI*2;
    const len = 0.5 + Math.random()*0.5;
    const crack = new THREE.Mesh(new THREE.BoxGeometry(len, 0.01, 0.025), potholeCrackMat);
    const r = POTHOLE_R*1.1 + len/2;
    crack.position.set(Math.cos(a)*r, 0.045, Math.sin(a)*r*0.85);
    crack.rotation.y = -a;
    g.add(crack);
  }
  return g;
}

// ---------- Obstacles: wooden crate stacks ----------
const crateWoodMat = new THREE.MeshStandardMaterial({color:0x9b6b3a, roughness:0.85});
const crateFrameMat = new THREE.MeshStandardMaterial({color:0x6e4a26, roughness:0.9});
const crateNailMat = new THREE.MeshStandardMaterial({color:0x8d9096, roughness:0.4, metalness:0.7});
const CRATE_BOTTOM = 0.72, CRATE_TOP = 0.52;
const CRATE_HIT_RADIUS = CRATE_BOTTOM/2 + 0.15;
const CRATE_CLEAR_Y = CRATE_BOTTOM + CRATE_TOP*0.6; // must clear the upper crate too

function buildCrate(size){
  const c = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(size,size,size), crateWoodMat);
  body.position.y = size/2;
  body.castShadow = true;
  body.receiveShadow = true;
  c.add(body);
  const t = 0.07, h = size/2;
  // Twelve frame edges: 4 verticals, 4 top, 4 bottom
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const post = new THREE.Mesh(new THREE.BoxGeometry(t, size+0.01, t), crateFrameMat);
    post.position.set(sx*(h-t/2+0.005), size/2, sz*(h-t/2+0.005));
    c.add(post);
  });
  [0.035, size-0.035].forEach(y=>{
    [-1,1].forEach(s=>{
      const bx = new THREE.Mesh(new THREE.BoxGeometry(size+0.01, t, t), crateFrameMat);
      bx.position.set(0, y, s*(h-t/2+0.005));
      c.add(bx);
      const bz = new THREE.Mesh(new THREE.BoxGeometry(t, t, size+0.01), crateFrameMat);
      bz.position.set(s*(h-t/2+0.005), y, 0);
      c.add(bz);
    });
  });
  // Diagonal brace on each of the four sides
  const brLen = Math.sqrt(2)*(size-t*2);
  for(let f=0;f<4;f++){
    const brace = new THREE.Mesh(new THREE.BoxGeometry(brLen, 0.06, 0.03), crateFrameMat);
    const ang = f*Math.PI/2;
    brace.position.set(Math.sin(ang)*(h+0.005), size/2, Math.cos(ang)*(h+0.005));
    brace.rotation.y = ang;
    brace.rotation.z = Math.PI/4;
    c.add(brace);
  }
  // Nail heads in the corners of the front/back faces
  [-1,1].forEach(fz=>{
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([nx,ny])=>{
      const nail = new THREE.Mesh(new THREE.SphereGeometry(0.014,5,5), crateNailMat);
      nail.position.set(nx*(h-0.09), size/2+ny*(h-0.09), fz*(h+0.012));
      c.add(nail);
    });
  });
  return c;
}

function buildCrateStack(){
  const g = new THREE.Group();
  const bottom = buildCrate(CRATE_BOTTOM);
  g.add(bottom);
  const top = buildCrate(CRATE_TOP);
  top.position.set((Math.random()-0.5)*0.08, CRATE_BOTTOM, (Math.random()-0.5)*0.08);
  top.rotation.y = (Math.random()-0.5)*0.5; // stacked a little crooked
  g.add(top);
  g.rotation.y = (Math.random()-0.5)*0.2;
  return g;
}

const obstacles = [];

function spawnPothole(z){
  const row = new THREE.Group();
  const hole = buildPothole();
  const maxX = LANE_WIDTH/2 - POTHOLE_HIT_RADIUS - 0.3;
  hole.position.x = (Math.random()*2-1)*maxX;
  row.add(hole);
  row.position.set(0, 0, z);
  row.userData = {type:'pothole', items:[hole], hitRadius:POTHOLE_HIT_RADIUS, full:false, clearY:0.3};
  scene.add(row);
  obstacles.push(row);
}

function spawnCrateRow(z){
  // 1-2 crate stacks anchored to one side; taller than the other obstacles,
  // so the jump has to be well timed to clear the top crate.
  const count = 1 + Math.floor(Math.random()*2);
  const hitRadius = CRATE_HIT_RADIUS;
  const spacing = hitRadius*2 + 0.15;
  const totalWidth = spacing*(count-1);
  const maxX = LANE_WIDTH/2 - hitRadius - 0.2;
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -maxX : maxX - totalWidth;
  const row = new THREE.Group();
  const items = [];
  for(let i=0;i<count;i++){
    const stack = buildCrateStack();
    stack.position.set(startX + i*spacing, 0, 0);
    row.add(stack);
    items.push(stack);
  }
  row.position.set(0, 0, z);
  row.userData = {type:'crates', items, hitRadius, full:false, clearY:CRATE_CLEAR_Y};
  scene.add(row);
  obstacles.push(row);
}

function spawnConeRow(z){
  // Lay 2-5 cones side by side, anchored to one edge of the lane so the
  // other edge stays open for the player to run through.
  const count = 2 + Math.floor(Math.random()*4);
  const hitRadius = CONE_HIT_RADIUS;
  const spacing = hitRadius*2 + 0.1;
  const totalWidth = spacing*(count-1);
  const maxX = LANE_WIDTH/2 - hitRadius - 0.2;
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -maxX : maxX - totalWidth;
  const row = new THREE.Group();
  const items = [];
  for(let i=0;i<count;i++){
    const cone = buildCone();
    cone.position.set(startX + i*spacing, 0, 0);
    row.add(cone);
    items.push(cone);
  }
  row.position.set(0, 0, z);
  row.userData = {type:'cones', items, hitRadius, full:false};
  scene.add(row);
  obstacles.push(row);
}

function spawnBarrelRow(z){
  // 1-3 oil drums, same anchored-to-one-side layout as the cones but a
  // taller, narrower silhouette — a different read at a glance.
  const count = 1 + Math.floor(Math.random()*3);
  const hitRadius = BARREL_HIT_RADIUS;
  const spacing = hitRadius*2 + 0.15;
  const totalWidth = spacing*(count-1);
  const maxX = LANE_WIDTH/2 - hitRadius - 0.2;
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -maxX : maxX - totalWidth;
  const row = new THREE.Group();
  const items = [];
  for(let i=0;i<count;i++){
    const barrel = buildBarrel();
    barrel.position.set(startX + i*spacing, 0, 0);
    row.add(barrel);
    items.push(barrel);
  }
  row.position.set(0, 0, z);
  row.userData = {type:'barrels', items, hitRadius, full:false};
  scene.add(row);
  obstacles.push(row);
}

function spawnBarrier(z){
  // A single sawhorse road barricade spanning the whole lane — there is no
  // gap to run through, so this one can only be cleared with a jump.
  const row = new THREE.Group();
  const barrier = buildBarrier();
  row.add(barrier);
  row.position.set(0, 0, z);
  row.userData = {type:'barrier', items:[barrier], hitRadius:0, full:true};
  scene.add(row);
  obstacles.push(row);
}

// Randomly picks one of five obstacle kinds so a run mixes cone rows, barrel
// clusters, full-width barricades, potholes and crate stacks.
function spawnObstacle(z){
  const r = Math.random();
  if(r < 0.28) spawnConeRow(z);
  else if(r < 0.48) spawnBarrelRow(z);
  else if(r < 0.65) spawnBarrier(z);
  else if(r < 0.83) spawnPothole(z);
  else spawnCrateRow(z);
}

// Repositions an obstacle row's items after it scrolls past the player,
// using whichever layout its type needs (anchored-to-one-side for cones
// and barrels, dead center for the full-width barrier).
function repositionObstacleRow(row){
  const {type, items, hitRadius} = row.userData;
  if(type === 'barrier'){
    const item = items[0];
    if(item.parent !== row) row.add(item); // bring back a barrier smashed last lap
    return;
  }
  if(type === 'pothole'){
    const hole = items[0];
    if(hole.parent !== row) row.add(hole);
    const mx = LANE_WIDTH/2 - hitRadius - 0.3;
    hole.position.x = (Math.random()*2-1)*mx;
    return;
  }
  const count = items.length;
  const spacing = hitRadius*2 + (type === 'cones' ? 0.1 : 0.15);
  const totalWidth = spacing*(count-1);
  const maxX = LANE_WIDTH/2 - hitRadius - 0.2;
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -maxX : maxX - totalWidth;
  items.forEach((item,i)=>{
    if(item.parent !== row) row.add(item); // bring back items smashed last lap
    item.position.x = startX + i*spacing;
  });
}

// Alloy wheel: tire + rim + a handful of tapered spokes + hubcap cap,
// so it reads as a real wheel instead of a flat disc from any angle.
function buildWheel(radius){
  const wg = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,0.28,20), carTireMat);
  tire.rotation.z = Math.PI/2;
  tire.castShadow = true;
  wg.add(tire);
  // Faint tread grooves as thin dark rings
  for(let i=-1;i<=1;i++){
    const groove = new THREE.Mesh(new THREE.TorusGeometry(radius*0.99, 0.012, 6, 20), carTireTreadMat);
    groove.rotation.y = Math.PI/2;
    groove.position.x = i*0.08;
    wg.add(groove);
  }
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.58,radius*0.58,0.3,16), carRimMat);
  rim.rotation.z = Math.PI/2;
  wg.add(rim);
  const spokeCount = 5;
  for(let i=0;i<spokeCount;i++){
    const ang = (i/spokeCount)*Math.PI*2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.31, radius*0.46, 0.075), carRimSpokeMat);
    spoke.position.set(0, Math.sin(ang)*radius*0.28, Math.cos(ang)*radius*0.28);
    spoke.rotation.x = ang;
    wg.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.16,radius*0.16,0.32,10), carHubcapMat);
  hub.rotation.z = Math.PI/2;
  wg.add(hub);
  return wg;
}

function addWheels(g, halfWidth, halfLen, wheelRadius, opts){
  opts = opts || {};
  const inset = opts.inset || 1.7;
  const wheelPositions = [
    [halfWidth+0.04, halfLen-wheelRadius*inset], [-(halfWidth+0.04), halfLen-wheelRadius*inset],
    [halfWidth+0.04, -(halfLen-wheelRadius*inset)], [-(halfWidth+0.04), -(halfLen-wheelRadius*inset)]
  ];
  wheelPositions.forEach(([wx,wz])=>{
    const wheel = buildWheel(wheelRadius);
    wheel.position.set(wx, wheelRadius, wz);
    g.add(wheel);
    // Dark wheel-arch lip above the tire, like a real fender opening
    const arch = new THREE.Mesh(new THREE.TorusGeometry(wheelRadius+0.09, 0.06, 8, 16, Math.PI), wheelArchMat);
    arch.rotation.z = Math.PI;
    arch.rotation.y = Math.PI/2;
    arch.position.set(wx>0?halfWidth-0.02:-(halfWidth-0.02), wheelRadius+0.06, wz);
    g.add(arch);
  });
}

// Headlights, taillights, bumpers, mirrors and door seams shared by the
// sedan and taxi bodies — real cars, not just a box with dots on it.
function addLightsAndMirrors(g, halfWidth, halfLen, cabinTopY){
  // Chrome-rimmed headlight clusters + amber indicator
  [-halfWidth*0.6, halfWidth*0.6].forEach(lx=>{

    housing.position.set(lx, 0.52, halfLen-0.03);

    const light = new THREE.Mesh(new THREE.SphereGeometry(0.085,10,10), carLightMat);
    light.position.set(lx, 0.52, halfLen+0.01);
    g.add(light);
    const indicator = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.05), carIndicatorMat);
    indicator.position.set(lx + (lx>0?0.11:-0.11), 0.5, halfLen-0.02);
    g.add(indicator);
  });
  // Chrome grille bars between the headlights
  for(let i=-1;i<=1;i++){
    const bar = new THREE.Mesh(new THREE.BoxGeometry(halfWidth*0.9, 0.03, 0.06), chromeTrimMat);
    bar.position.set(0, 0.4+i*0.09, halfLen-0.04);
    g.add(bar);
  }
  const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(halfWidth*2+0.06, 0.22, 0.2), bumperMat);
  frontBumper.position.set(0, 0.28, halfLen-0.06);
  frontBumper.castShadow = true;
  g.add(frontBumper);
  const frontLip = new THREE.Mesh(new THREE.BoxGeometry(halfWidth*2+0.02, 0.04, 0.06), chromeTrimMat);
  frontLip.position.set(0, 0.4, halfLen-0.02);

  // Taillight clusters with a housing + a bright inner lens
  [-halfWidth*0.6, halfWidth*0.6].forEach(lx=>{
    const housing = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.22,0.07), carTailHousingMat);
    housing.position.set(lx, 0.56, -halfLen+0.03);

  const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(halfWidth*2+0.06, 0.22, 0.2), bumperMat);

  // Side mirrors: stalk + housing, angled out from the A-pillar
  [-1,1].forEach(side=>{

    mirror.position.set(side*(halfWidth+0.13), cabinTopY-0.24, halfLen*0.4);
    g.add(mirror);

  // Door seam lines (front + rear door) and a door handle on each side
  [-1,1].forEach(side=>{
    [halfLen*0.18, -halfLen*0.35].forEach(dz=>{

      seam.position.set(side*(halfWidth+0.005), 0.5, dz);

// Shared "real car" body: low lower-body, sloped hood/trunk, raked glass
// with visible pillars, and a rounded greenhouse — used by both the sedan
// and the taxi so they share real proportions, not just recolored boxes.
function addCarBody(g, hw, hl, bodyMat){
  // Lower body shell
  const body = new THREE.Mesh(new THREE.BoxGeometry(hw*2, 0.5, hl*2), bodyMat);
  body.position.y = 0.4;
  body.castShadow = true;
  g.add(body);
  // Upper body shoulder line, slightly narrower, gives a two-tier profile
  const shoulder = new THREE.Mesh(new THREE.BoxGeometry(hw*1.98, 0.22, hl*1.7), bodyMat);
  shoulder.position.set(0, 0.72, -hl*0.02);
  shoulder.castShadow = true;
  g.add(shoulder);

  // Sloped hood: tilted forward so the front edge sits lower than the
  // windshield base, giving a real aerodynamic nose instead of a flat lid.
  const hood = new THREE.Mesh(new THREE.BoxGeometry(hw*1.92, 0.1, hl*0.62), bodyMat);
  hood.position.set(0, 0.66, hl*0.56);
  hood.rotation.x = -0.1;
  hood.castShadow = true;
  g.add(hood);
  // Sloped trunk deck, lower toward the tail
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(hw*1.92, 0.09, hl*0.4), bodyMat);
  trunk.position.set(0, 0.64, -hl*0.68);
  trunk.rotation.x = 0.12;
  g.add(trunk);

  // Raked windshield bridging hood and roof
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(hw*1.5, 0.58, 0.05), glassWindshieldMat);
  windshield.position.set(0, 1.0, hl*0.28);
  windshield.rotation.x = -0.45;
  g.add(windshield);
  // Rear window, raked the other way down to the trunk
  const rearWindow = new THREE.Mesh(new THREE.BoxGeometry(hw*1.45, 0.5, 0.05), glassMat);
  rearWindow.position.set(0, 0.98, -hl*0.42);
  rearWindow.rotation.x = 0.5;
  g.add(rearWindow);
  // Side windows (glass) with visible dark pillars framing them
  const sideWindow = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.42, hl*0.82), glassMat);
  [-1,1].forEach(side=>{
    const sw = sideWindow.clone();
    sw.position.set(side*(hw*0.76), 1.0, -hl*0.06);
    g.add(sw);
    // A/B/C pillars
    [hl*0.32, -hl*0.08, -hl*0.46].forEach(pz=>{
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.05), pillarMat);
      pillar.position.set(side*(hw*0.77), 1.0, pz);
      g.add(pillar);
    });
  });
  // Rounded roof panel
  const roof = new THREE.Mesh(new THREE.BoxGeometry(hw*1.3, 0.09, hl*0.72), bodyMat);
  roof.position.set(0, 1.24, -hl*0.06);
  roof.castShadow = true;
  g.add(roof);
  const roofEdge = new THREE.Mesh(new THREE.BoxGeometry(hw*1.34, 0.05, hl*0.76), bodyMat);
  roofEdge.position.set(0, 1.185, -hl*0.06);
  g.add(roofEdge);

  return { roofTopY: 1.28 };
}

function buildSedan(){
  const {halfWidth:hw, halfLen:hl} = CAR_TYPES.sedan;
  const g = new THREE.Group();
  addCarBody(g, hw, hl, sedanBodyMat);
  const grille = new THREE.Mesh(new THREE.BoxGeometry(hw*1.15, 0.22, 0.05), grilleMat);
  grille.position.set(0, 0.42, hl+0.005);
  g.add(grille);
  addWheels(g, hw, hl, 0.34);
  addLightsAndMirrors(g, hw, hl, 1.0);
  return g;
}

function buildTaxi(){
  const {halfWidth:hw, halfLen:hl} = CAR_TYPES.taxi;
  const g = new THREE.Group();
  addCarBody(g, hw, hl, taxiBodyMat);
  const grille = new THREE.Mesh(new THREE.BoxGeometry(hw*1.15, 0.22, 0.05), grilleMat);
  grille.position.set(0, 0.42, hl+0.005);
  g.add(grille);
  // Black-and-yellow checker stripe running along the doors, real taxi style
  const checkerCount = 10;
  for(let i=0;i<checkerCount;i++){
    const cz = -hl*0.75 + i*(hl*1.5/checkerCount);
    [-1,1].forEach(side=>{
      const sq = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.1, hl*1.5/checkerCount*0.85),
        i%2===0 ? taxiCheckerMat : taxiCheckerLightMat);
      sq.position.set(side*(hw+0.008), 0.44, cz);
      g.add(sq);
    });
  }
  // Roof-mounted taxi sign
  const signBase = new THREE.Mesh(new THREE.BoxGeometry(hw*0.55, 0.03, 0.3), sedanLowerMat);
  signBase.position.set(0, 1.3, -hl*0.06);
  g.add(signBase);
  const sign = new THREE.Mesh(new THREE.BoxGeometry(hw*0.5, 0.15, 0.26), taxiSignMat);
  sign.position.set(0, 1.4, -hl*0.06);
  g.add(sign);
  addWheels(g, hw, hl, 0.34);
  addLightsAndMirrors(g, hw, hl, 1.0);
  return g;
}

function buildTruck(){
  // Styled after a real box/delivery truck: chrome grille, rounded white
  // cab with a raked windshield, chassis rail, and a tall ribbed cargo box.
  const {halfWidth:hw, halfLen:hl, height} = CAR_TYPES.truck;
  const g = new THREE.Group();
  const cabHalfLen = hl*0.32;
  const cabZ = hl - cabHalfLen;
  const cabHeight = height*0.62;

  // Chassis rail peeking below the body, ties cab and cargo box together
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(hw*1.6, 0.14, hl*1.9), truckChassisMat);
  chassis.position.set(0, 0.24, -0.1);
  g.add(chassis);

  // Chrome grille with horizontal bars + dark surround
  const grilleFrame = new THREE.Mesh(new THREE.BoxGeometry(hw*1.75, 0.4, 0.06), grilleMat);
  grilleFrame.position.set(0, 0.55, hl-0.05);
  g.add(grilleFrame);
  for(let i=-2;i<=2;i++){
    const bar = new THREE.Mesh(new THREE.BoxGeometry(hw*1.65, 0.035, 0.06), chromeTrimMat);
    bar.position.set(0, 0.55+i*0.07, hl-0.02);
    g.add(bar);
  }
  const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(hw*2+0.05, 0.28, 0.2), bumperMat);
  frontBumper.position.set(0, 0.26, hl-0.06);
  frontBumper.castShadow = true;
  g.add(frontBumper);
  const bumperLip = new THREE.Mesh(new THREE.BoxGeometry(hw*2+0.02, 0.03, 0.06), chromeTrimMat);
  bumperLip.position.set(0, 0.38, hl-0.03);
  g.add(bumperLip);

  const cab = new THREE.Mesh(new THREE.BoxGeometry(hw*2, cabHeight, cabHalfLen*2), truckCabMat);
  cab.position.set(0, cabHeight/2+0.32, cabZ);
  cab.castShadow = true;
  g.add(cab);
  // Raked windshield rather than a flat vertical pane
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(hw*1.7, cabHeight*0.5, 0.07), glassWindshieldMat);
  windshield.position.set(0, cabHeight*0.8+0.32, cabZ+cabHalfLen-0.06);
  windshield.rotation.x = -0.18;
  g.add(windshield);
  [-1,1].forEach(side=>{
    const sideWindow = new THREE.Mesh(new THREE.BoxGeometry(0.05, cabHeight*0.4, cabHalfLen*1.3), glassMat);
    sideWindow.position.set(side*(hw+0.005), cabHeight*0.72+0.32, cabZ);
    g.add(sideWindow);
    // door seam + handle on the cab
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.012, cabHeight*0.7, 0.012), doorSeamMat);
    seam.position.set(side*(hw+0.005), cabHeight*0.55+0.32, cabZ+cabHalfLen*0.1);
    g.add(seam);
  });
  const roofLine = new THREE.Mesh(new THREE.BoxGeometry(hw*2.02, 0.08, cabHalfLen*2), truckCabMat);
  roofLine.position.set(0, cabHeight+0.32, cabZ);
  g.add(roofLine);
  // Angled mirrors on long chrome stalks, like a real box truck
  [-1,1].forEach(side=>{
    const stalk = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.2), mirrorMat);
    stalk.position.set(side*(hw+0.06), cabHeight*0.68+0.32, cabZ+cabHalfLen*0.75);
    g.add(stalk);
    const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.3,0.32), mirrorMat);
    mirror.position.set(side*(hw+0.17), cabHeight*0.65+0.32, cabZ+cabHalfLen*0.65);
    g.add(mirror);
  });
  [-1,1].forEach(side=>{
    const housing = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.2,0.08), carLightHousingMat);
    housing.position.set(side*hw*0.82, 0.5, hl-0.03);
    g.add(housing);
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10), carLightMat);
    light.position.set(side*hw*0.82, 0.5, hl+0.01);
    g.add(light);
  });
  [-1,1].forEach(side=>{
    const marker = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), truckMarkerMat);
    marker.position.set(side*hw*0.55, cabHeight+0.35, cabZ+cabHalfLen-0.02);
    g.add(marker);
  });

  // Cargo box fills the remaining rear length, right behind the cab
  const cargoHalfLen = hl - cabHalfLen*2 - 0.08;
  const cargoZ = cabZ - cabHalfLen - cargoHalfLen - 0.08;
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(hw*2.1, height, cargoHalfLen*2), truckBoxMat);
  cargo.position.set(0, height/2, cargoZ);
  cargo.castShadow = true;
  g.add(cargo);
  // Horizontal corrugated ribs along the cargo box, like the reference photo
  const ribCount = 7;
  for(let i=0;i<ribCount;i++){
    const ribZ = cargoZ - cargoHalfLen + (i+0.5)*(cargoHalfLen*2/ribCount);
    const rib = new THREE.Mesh(new THREE.BoxGeometry(hw*2.12, 0.05, 0.05), truckRibMat);
    rib.position.set(0, height*0.15, ribZ);
    g.add(rib);
  }
  // Bottom trim + rear roll-up door seam
  const doorSeam = new THREE.Mesh(new THREE.BoxGeometry(hw*2.1, height*0.94, 0.015), doorSeamMat);
  doorSeam.position.set(0, height/2, cargoZ-cargoHalfLen-0.005);
  g.add(doorSeam);
  const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(hw*2.1, 0.22, 0.18), bumperMat);
  rearBumper.position.set(0, 0.24, cargoZ-cargoHalfLen-0.05);
  g.add(rearBumper);
  // Rubber mud flaps behind the rear wheels
  [-1,1].forEach(side=>{
    const flap = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.3,0.02), doorSeamMat);
    flap.position.set(side*hw*0.85, 0.15, -hl+0.55);
    g.add(flap);
  });

  addWheels(g, hw, hl, 0.4, {inset:1.5});
  return g;
}

const cars = [];
const CAR_APPROACH_SPEED = 9; // extra closing speed on top of the world scroll — noticeably faster than before
let carSpawnTimer = 6 + Math.random()*5;

// A shuffled "bag" of the 3 car types, refilled and reshuffled once empty —
// guarantees every type shows up within every 3 spawns instead of leaving
// the truck to random chance.
let carTypeBag = [];
function nextCarType(){
  if(carTypeBag.length === 0){
    carTypeBag = ['sedan','truck','taxi'];
    for(let i=carTypeBag.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [carTypeBag[i], carTypeBag[j]] = [carTypeBag[j], carTypeBag[i]];
    }
  }
  return carTypeBag.pop();
}

function spawnCar(z){
  const type = nextCarType();
  const car = type === 'sedan' ? buildSedan() : type === 'truck' ? buildTruck() : buildTaxi();
  const { halfWidth } = CAR_TYPES[type];
  car.userData.hitRadius = halfWidth + 0.5;
  const maxX = LANE_WIDTH/2 - halfWidth - 0.3;
  car.position.set((Math.random()*2-1)*maxX, 0, z);
  trimShadows(car);
  scene.add(car);
  cars.push(car);
}

// Formation slot for the i-th officer: #0 leads on the player's line, the rest
// fan out in pairs on either side, each pair a little further back.
function policeSlot(i){
  if(i === 0) return {x:0, z:0};
  const r = Math.ceil(i/2), side = (i%2===1) ? -1 : 1;
  return {x: side*1.5, z: r*1.2};
}

function spawnPolice(){
  if(polices.length >= POLICE_MAX) return;
  const first = polices.length === 0;
  const ch = buildPolice();
  ch.slot = policeSlot(polices.length);
  ch.jy = 0; ch.jv = 0; ch.air = false; ch.handled = new Set();
  ch.group.position.set(
    Math.max(-halfLane, Math.min(halfLane, player.position.x + ch.slot.x)), 0,
    player.position.z + policeGap + ch.slot.z);
  scene.add(ch.group);
  polices.push(ch);
  policeSpawned = true;
  const p = ch.group.position.clone(); p.y = 1.2;
  burst(p, [0x3b7bff,0xffffff,0xffd24a], 12, 4, 3);
  if(first){
    policeGap = POLICE_GAP; policeT = 0;
    policeTimerEl.style.opacity = 1;

    w.classList.remove('show'); void w.offsetWidth; w.classList.add('show');

    [0,0.35,0.7,1.05].forEach((d,i)=>tone(i%2?660:880, 0.32, 'sawtooth', 0.05, i%2?880:660, d));
  } else {
    popText(p.clone().add(new THREE.Vector3(0,1.4,0)), '🚓 警察が増えた！ ×' + polices.length, 'blue');

}

function clearPolice(){
  polices.forEach(pl=>scene.remove(pl.group));
  polices.length = 0;
  fleeing.forEach(pl=>scene.remove(pl.group));
  fleeing.length = 0;
  policeSpawned = false; policeGap = POLICE_GAP; policeT = 0; police500Fired = false;
  policeTimerEl.style.opacity = 0; policeTimerEl.classList.remove('danger');
  const w = document.getElementById('policewarn'); if(w) w.classList.remove('show');
}


// The player gets away: every officer is left behind (one may be the one that
// tripped and is lying on the road). Police are gone until the next trigger.
function startPoliceEscape(tripper, reason){
  if(!policeSpawned) return;
  polices.forEach(pl=>{
    pl.left = 0;
    pl.mode = (pl === tripper) ? 'tripped' : 'left';
    pl.fallT = 0; pl.air = false;
    fleeing.push(pl);
  });
  polices.length = 0;
  policeSpawned = false; policeT = 0; policeGap = POLICE_GAP;
  policeTimerEl.style.opacity = 0; policeTimerEl.classList.remove('danger');
  const p = player.position.clone(); p.y = 1.8;
  popText(p, reason === 'spring' ? '🏃 バネで逃げ切った！' : '🏃 警察が転んだ！逃げ切った！', 'big');
  flashScreen('#ffffff', 0.3); sfx.coin(6);
  tone(660, 0.15, 'square', 0.05, 990); tone(990, 0.2, 'square', 0.05, 1320, 0.15);
}

function updateFleeing(dt, worldSpeed){
  for(let i=fleeing.length-1;i>=0;i--){
    const pl = fleeing[i], g = pl.group;
    const k = Math.min(1, dt*9);
    if(pl.mode === 'tripped'){
      pl.fallT += dt;
      g.position.z += worldSpeed*dt; // lies on the road while the scenery scrolls past
      lerpTo(g.rotation, 'x', -1.5, k);
      lerpTo(g.position, 'y', -0.95, k);
      lerpTo(pl.legL.upper.rotation, 'x', 0.1, k); lerpTo(pl.legR.upper.rotation, 'x', 0.1, k);
      lerpTo(pl.legL.knee.rotation, 'x', -0.3, k); lerpTo(pl.legR.knee.rotation, 'x', -0.3, k);
      lerpTo(pl.armL.shoulder.rotation, 'x', -2.4, k); lerpTo(pl.armR.shoulder.rotation, 'x', -2.4, k);
      if(g.position.z > 14){ scene.remove(g); fleeing.splice(i,1); }
    } else {
      pl.left += 14*dt; // dropping back fast
      g.position.z = player.position.z + POLICE_GAP_FIXED + pl.slot.z + pl.left;
      pl.walkCycle += dt*8;
      const sw = Math.sin(pl.walkCycle)*0.6;
      pl.legL.upper.rotation.x = sw; pl.legR.upper.rotation.x = -sw;
      pl.legL.knee.rotation.x = -Math.max(0, sw)*0.8; pl.legR.knee.rotation.x = -Math.max(0, -sw)*0.8;
      pl.armL.shoulder.rotation.x = -sw*0.6; pl.armR.shoulder.rotation.x = sw*0.6;
      lerpTo(g.position, 'y', 0, k);
      if(pl.left > 45){ scene.remove(g); fleeing.splice(i,1); }
    }
  }
}

function updatePolice(dt, worldSpeed){
  updateFleeing(dt, worldSpeed);
  if(!police500Fired && distance >= POLICE_START_AT){
    police500Fired = true;
    if(!policeSpawned) spawnPolice();
  }
  if(!policeSpawned) return;

  // 45 s after they appear, they catch up no matter what.
  policeT += dt;
  const left = Math.max(0, POLICE_TIME_LIMIT - policeT);
  policeTimerEl.textContent = '🚓 ' + Math.ceil(left);
  policeTimerEl.classList.toggle('danger', left <= 10);
  if(left <= 0){ endGame('police'); return; }

  let tripped = null;
  polices.forEach(pl=>{
    const g = pl.group;
    g.position.z = player.position.z + policeGap + pl.slot.z;

    // Sidestep oncoming cars (they can't be jumped), otherwise hold the slot.
    let tx = Math.max(-halfLane, Math.min(halfLane, player.position.x + pl.slot.x));
    for(const car of cars){
      const ahead = g.position.z - car.position.z;
      if(ahead > -1 && ahead < 9 && Math.abs(car.position.x - tx) < car.userData.hitRadius + 0.9){
        const sd = tx >= car.position.x ? 1 : -1;
        tx = Math.max(-halfLane, Math.min(halfLane, car.position.x + sd*(car.userData.hitRadius + 1.1)));
      }
    }
    g.position.x += (tx - g.position.x) * Math.min(1, dt*4);

    // Real jumping: look ahead for a row of obstacles in this officer's path and
    // take off so the apex lands right over it (same jump as the player).
    const lead = Math.max(1.5, worldSpeed*(2*JUMP_SPEED/(-GRAVITY))*0.5); // same jump as the player
    obstacles.forEach(row=>{
      const d = g.position.z - row.position.z; // >0: row is still ahead of the officer
      if(d < -1){ pl.handled.delete(row); return; }
      if(pl.air || pl.handled.has(row) || d < 0 || d > lead) return;
      const ud = row.userData;
      let inPath = ud.full;
      if(!inPath){
        for(const it of ud.items){
          if(it.parent === row && Math.abs(row.position.x + it.position.x - g.position.x) < ud.hitRadius + 0.55){ inPath = true; break; }
        }
      }
      if(inPath){
        pl.handled.add(row);
        if(!tripped && Math.random() < POLICE_TRIP_CHANCE){ tripped = pl; }
        else { pl.air = true; pl.jv = JUMP_SPEED; }
      }
    });
    if(pl.air){
      pl.jv += GRAVITY*dt; pl.jy += pl.jv*dt;
      if(pl.jy <= 0){ pl.jy = 0; pl.jv = 0; pl.air = false; }
    }
    g.position.y = pl.air ? pl.jy : Math.abs(Math.sin(pl.walkCycle*2))*0.05;

    // Same gait as the red enemy on the ground; tucked pose in the air.
    pl.walkCycle += dt*4.2;
    if(pl.air){
      const k = Math.min(1, dt*14);
      pl.legL.upper.rotation.x += (-1.0 - pl.legL.upper.rotation.x)*k;
      pl.legR.upper.rotation.x += (-1.0 - pl.legR.upper.rotation.x)*k;
      pl.legL.knee.rotation.x += (-1.9 - pl.legL.knee.rotation.x)*k;
      pl.legR.knee.rotation.x += (-1.9 - pl.legR.knee.rotation.x)*k;
      pl.armL.shoulder.rotation.x += (-0.6 - pl.armL.shoulder.rotation.x)*k;
      pl.armR.shoulder.rotation.x += (-0.6 - pl.armR.shoulder.rotation.x)*k;
      pl.armL.elbow.rotation.x += (1.1 - pl.armL.elbow.rotation.x)*k;
      pl.armR.elbow.rotation.x += (1.1 - pl.armR.elbow.rotation.x)*k;
    } else {
      const sw = Math.sin(pl.walkCycle)*0.5;
      pl.legL.upper.rotation.x = sw;
      pl.legR.upper.rotation.x = -sw;
      pl.legL.knee.rotation.x = -Math.max(0, sw)*0.7;
      pl.legR.knee.rotation.x = -Math.max(0, -sw)*0.7;
      pl.armL.shoulder.rotation.x = -sw*0.6;
      pl.armR.shoulder.rotation.x = sw*0.6;
      pl.armL.elbow.rotation.x = 0.15 + Math.max(0,-sw)*0.3;
      pl.armR.elbow.rotation.x = 0.15 + Math.max(0,sw)*0.3;
    }
  });
  // An officer tripped on a jump: the chase is over.
  if(tripped) startPoliceEscape(tripped, 'trip');
}

// ---------- Joystick input (always visible, fixed base) ----------
let joyActive = false, joyDX = 0, joyDY = 0;
let baseCX = 0, baseCY = 0;
const zone = document.getElementById('joyzone');
const base = document.getElementById('joybase');
const stick = document.getElementById('joystick');
const MAXR = 45;

function updateBaseCenter(){
  const r = base.getBoundingClientRect();
  baseCX = r.left + r.width/2;
  baseCY = r.top + r.height/2;
}
updateBaseCenter();
addEventListener('resize', updateBaseCenter);

function moveStick(x,y){
  let dx = x - baseCX, dy = y - baseCY;
  const dist = Math.hypot(dx,dy);
  if(dist > MAXR){ dx = dx/dist*MAXR; dy = dy/dist*MAXR; }
  joyDX = dx/MAXR; joyDY = dy/MAXR;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}
function joyReset(){
  joyDX = 0; joyDY = 0;
  stick.style.transform = 'translate(0px, 0px)';
}
function joyStart(x,y){
  updateBaseCenter();
  joyActive = true;
  moveStick(x,y);
}
function joyEnd(){
  joyActive = false;
  joyReset();
}
zone.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; joyStart(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
zone.addEventListener('touchmove', e=>{ if(!joyActive) return; const t=e.changedTouches[0]; moveStick(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
zone.addEventListener('touchend', e=>{ joyEnd(); e.preventDefault(); }, {passive:false});
zone.addEventListener('touchcancel', e=>{ joyEnd(); e.preventDefault(); }, {passive:false});
zone.addEventListener('mousedown', e=>joyStart(e.clientX,e.clientY));
addEventListener('mousemove', e=>{ if(joyActive) moveStick(e.clientX,e.clientY); });
addEventListener('mouseup', ()=>joyEnd());

// Keyboard fallback (desktop testing)
let keyDX = 0;
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') keyDX=-1;
  if(e.key==='ArrowRight'||e.key==='d') keyDX=1;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w') doJump();
});
addEventListener('keyup', e=>{
  if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)) keyDX=0;
});

// ---------- Jump ----------
let isJumping = false;

let jumpY = 0;

  isJumping = true;
  jumpVelY = JUMP_SPEED;

const jumpBtn = document.getElementById('jumpbtn');
jumpBtn.addEventListener('touchstart', e=>{ doJump(); e.preventDefault(); }, {passive:false});
jumpBtn.addEventListener('mousedown', e=>{ doJump(); e.preventDefault(); });

// ---------- Punch attack (windup -> strike -> recover) ----------
// Runs independently of movement so the player can punch while running.
let attackPhase = 'none'; // 'none' | 'windup' | 'punch' | 'recover'
let attackT = 0;
const WINDUP_DUR = 0.16, PUNCH_DUR = 0.15, RECOVER_DUR = 0.3;

// Arm target poses (shoulder x/y/z rotation, elbow x rotation)
const POSE = {
  // Punching fist coils back past the ribs, guard fist comes up near the chin —
  // a real wind-up so the strike has somewhere to travel from.
  windupArmR: {sx:-1.35, sy:0.15, sz:0.2, ex:2.0},
  windupArmL: {sx:0.25, sy:-0.1, sz:-0.35, ex:2.05},
  // Straight forward jab: shoulder drives hard forward, elbow snaps to full
  // extension for the strike; the guard hand stays up near the chin.
  punchArmR: {sx:1.55, sy:0.05, sz:0.0, ex:0.05},
  punchArmL: {sx:0.2, sy:-0.1, sz:-0.3, ex:2.0},

let actx = null;
function unlockAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
}
['touchstart','mousedown','keydown'].forEach(ev=>addEventListener(ev, unlockAudio, {capture:true, passive:true}));
function tone(freq, dur, type, vol, slideTo, delay){
  if(!actx) return;
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol||0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.03);
}
function noiseBurst(dur, vol, delay){
  if(!actx) return;
  const t = actx.currentTime + (delay||0);
  const len = Math.max(1, Math.floor(actx.sampleRate*dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = vol||0.15;
  src.connect(g); g.connect(actx.destination);
  src.start(t);
}

const particles = [];
const pGeo = new THREE.BoxGeometry(0.14,0.14,0.14);
const pMatCache = {};
function pMat(c){ return pMatCache[c] || (pMatCache[c] = new THREE.MeshBasicMaterial({color:c})); }
function burst(pos, colors, n, power, up){
  const list = Array.isArray(colors) ? colors : [colors];
  for(let i=0;i<n;i++){
    if(particles.length > 320) return;
    const m = new THREE.Mesh(pGeo, pMat(list[Math.floor(Math.random()*list.length)]));
    m.position.copy(pos);
    const a = Math.random()*Math.PI*2, r = 0.3 + Math.random()*0.7;
    const v = new THREE.Vector3(Math.cos(a)*power*r, up*(0.4+Math.random()), Math.sin(a)*power*r);
    const sc = 0.7 + Math.random()*1.3;
    m.scale.setScalar(sc);
    scene.add(m);
    const life = 0.5 + Math.random()*0.5;
    particles.push({m, v, life, max:life, s:sc});
  }
}
function updateParticles(dt, ws){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ scene.remove(p.m); particles.splice(i,1); continue; }
    p.v.y -= 18*dt;
    p.m.position.x += p.v.x*dt;
    p.m.position.y += p.v.y*dt;
    p.m.position.z += (p.v.z + ws)*dt;
    if(p.m.position.y < 0.05){ p.m.position.y = 0.05; p.v.y *= -0.4; }
    p.m.rotation.x += dt*8; p.m.rotation.y += dt*6;
    p.m.scale.setScalar(Math.max(0.05, p.life/p.max)*p.s);
  }
}

let pickupTimer = 1.2;
const coinGeo = new THREE.CylinderGeometry(0.32,0.32,0.08,20);
const coinMat = new THREE.MeshStandardMaterial({color:0xffd23a, emissive:0x8a5b00, metalness:0.8, roughness:0.25});

const starGeo = (function(){
  const shape = new THREE.Shape();
  const R = 0.6, r = 0.27;
  for(let i=0;i<10;i++){
    const a = Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0 ? R : r;
    const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
    if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {depth:0.18, bevelEnabled:false});
  geo.center();
  return geo;
})();
function makeCoin(x,y,z){
  const g = new THREE.Group();
  const m = new THREE.Mesh(coinGeo, coinMat);
  m.rotation.x = Math.PI/2;
  g.add(m);
